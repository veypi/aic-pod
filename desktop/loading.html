<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>AIC Desktop</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .wrap {
      text-align: center;
      color: #333;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #ddd;
      border-top-color: #4a7dff;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .title {
      font-size: 15px;
      font-weight: 500;
    }

    .step {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="title">AIC Desktop 正在启动…</div>
    <div class="step" id="step"></div>
  </div>
  <script>
    // 步骤进度：主进程经 IPC 推送（loading 页无 preload，直接 executeJavaScript）
    window.__setStep = (t) => {
      const el = document.getElementById('step')
      if (el) el.textContent = t || ''
    }
  </script>
</body>

</html>
