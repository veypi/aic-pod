<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>AIC 本地设置</title>
  <!--
    AIC Desktop 本地设置页：单文件静态页（无框架、无构建、无本地 HTTP 服务）。
    数据全部经 Electron 桥：window.aicDesktop.api(method, args) → 主进程 spawn
    `aic-backend config|bind|unbind` 子命令 / 读日志 / 重启后端子进程。
    页面由 main.js 的 app://aic 协议提供（真实 origin，localStorage 可用）。
    主题：默认跟随系统（prefers-color-scheme），可切 浅色/深色；html[data-theme] +
    color-scheme 同时管住原生控件（placeholder/滚动条/下拉），避免深色下出现黑字。
  -->
  <script>
    (() => {
      const KEY = 'theme'
      const read = () => { try { return localStorage.getItem(KEY) } catch (e) { return null } }
      const sysDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      window.__theme = {
        mode: () => (['light', 'dark'].includes(read()) ? read() : 'system'),
        resolve(mode) { return mode === 'system' ? (sysDark() ? 'dark' : 'light') : mode },
        set(mode) {
          try { mode === 'system' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, mode) } catch (e) { /* 忽略 */ }
          window.__theme.apply()
        },
        cycle() {
          const next = { system: 'light', light: 'dark', dark: 'system' }
          window.__theme.set(next[window.__theme.mode()])
        },
        apply() {
          const mode = window.__theme.mode()
          const resolved = window.__theme.resolve(mode)
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.themeMode = mode
          const btn = document.getElementById('btnTheme')
          if (btn) btn.textContent = { system: '跟随系统', light: '浅色', dark: '深色' }[mode]
        },
      }
      window.__theme.apply()
      const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
      if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (window.__theme.mode() === 'system') window.__theme.apply() })
    })()
  </script>
  <style>
    /* 浅色（默认） */
    :root {
      color-scheme: light;
      --bg: #eef1f7;
      --card: #ffffff;
      --field: #f8fafc;
      --fg: #0f172a;
      --fg2: #475569;
      --fg3: #8590a3;
      --line: #e3e8f0;
      --line2: #cfd7e3;
      --brand: #3b6ef6;
      --brand-h: #2f5cd8;
      --brand-text: #ffffff;
      --brand-soft: rgb(59 110 246 / .10);
      --ok: #16a34a;
      --warn: #b45309;
      --danger: #dc2626;
      --a-fs: #3b82f6;
      --a-net: #8b5cf6;
      --a-ssh: #f59e0b;
      --shadow: 0 18px 40px -30px rgb(15 23 42 / .5);
    }

    /* 深色 */
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101216;
      --card: #171a21;
      --field: #1e222a;
      --fg: #e9edf5;
      --fg2: #b3bcc9;
      --fg3: #7c8595;
      --line: #272c35;
      --line2: #39404b;
      --brand: #5b86f8;
      --brand-h: #6f95fa;
      --brand-text: #0b1020;
      --brand-soft: rgb(91 134 248 / .18);
      --ok: #4ade80;
      --warn: #fbbf24;
      --danger: #f87171;
      --shadow: 0 20px 44px -30px rgb(0 0 0 / .85);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      display: flex;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .card {
      width: min(560px, 100%);
      margin: auto;
      padding: 20px 24px 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow)
    }

    /* ---- 头部：标题 + 连接状态 + 主题 ---- */
    header {
      display: flex;
      align-items: center;
      gap: 8px
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: .01em
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 46%;
      padding: 3px 10px 3px 8px;
      border-radius: 999px;
      background: rgb(139 147 161 / .12);
      color: var(--fg2);
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pill.on {
      background: rgb(34 197 94 / .14)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg3);
      flex: none
    }

    .pill.on .dot {
      background: var(--ok)
    }

    .pill.off .dot {
      background: var(--danger)
    }

    /* ---- 顶部操作条（保存/重连在最上，改动了才有保存） ---- */
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 2px;
      min-height: 31px
    }

    .bar .spacer {
      flex: 1
    }

    /* ---- 分区 ---- */
    .sec {
      margin: 18px 0 0;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--fg3)
    }

    .sec:first-of-type {
      margin-top: 12px
    }

    .hint {
      margin: 6px 0 0;
      font-size: 11.5px;
      color: var(--fg3)
    }

    /* ---- 字段 ---- */
    .f {
      display: block;
      margin-top: 12px
    }

    .f>span {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: var(--fg2)
    }

    .f em {
      font-style: normal;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--fg3)
    }

    input,
    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line2);
      border-radius: 8px;
      background: var(--field);
      color: var(--fg);
      font-size: 13px;
      font-family: inherit;
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease
    }

    input:hover,
    select:hover {
      border-color: var(--fg3)
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--brand);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--brand-soft)
    }

    input::placeholder {
      color: var(--fg3)
    }

    select option {
      background: var(--card);
      color: var(--fg)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .row input {
      flex: 1
    }

    .grid-size {
      display: grid;
      grid-template-columns: 1fr 84px 84px;
      gap: 8px;
      align-items: center;
      margin-top: 8px
    }

    /* ---- 按钮 ---- */
    button {
      padding: 7px 15px;
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: var(--brand-text);
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s ease, border-color .12s ease, color .12s ease
    }

    button:hover {
      background: var(--brand-h)
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line2);
      color: var(--fg2)
    }

    button.ghost:hover {
      border-color: var(--brand);
      color: var(--brand)
    }

    button.mini {
      padding: 7px 11px;
      font-size: 12px
    }

    #msg {
      font-size: 12px;
      color: var(--fg3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 46%;
      text-align: right
    }

    /* ---- 授权 ---- */
    .domain {
      margin-top: 10px;
      padding: 10px 12px 12px;
      border: 1px solid var(--line2);
      border-radius: 10px;
      background: var(--field)
    }

    .dhead {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dhead select {
      width: auto;
      margin-left: auto;
      padding: 4px 8px;
      font-size: 12px
    }

    .dname {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600
    }

    .dname::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fg3)
    }

    .domain[data-k="fs"] .dname::before {
      background: var(--a-fs)
    }

    .domain[data-k="net"] .dname::before {
      background: var(--a-net)
    }

    .domain[data-k="ssh"] .dname::before {
      background: var(--a-ssh)
    }

    .alist {
      margin-top: 9px
    }

    .alist>.lbl {
      font-size: 11px;
      color: var(--fg3);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace
    }

    .entries:empty {
      display: none
    }

    .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px
    }

    .entry span {
      flex: 1;
      word-break: break-all;
      color: var(--fg2)
    }

    button.x {
      padding: 0 6px;
      background: transparent;
      color: var(--fg3);
      font-size: 14px;
      line-height: 1
    }

    button.x:hover {
      background: transparent;
      color: var(--danger)
    }

    .alist .row {
      margin-top: 5px
    }

    .alist .row input {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      padding: 6px 9px
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <header>
      <h1>AIC 本地设置</h1>
      <span class="pill" id="status" title="后端子进程连接状态"><span class="dot" id="sdot"></span><span
          id="stext">检查中…</span></span>
      <button id="btnTheme" class="ghost mini" title="主题：跟随系统 / 浅色 / 深色">跟随系统</button>
    </header>

    <div class="bar">
      <button id="btnSave" hidden>保存</button>
      <button id="btnReconnect" class="ghost">重连</button>
      <span class="spacer"></span>
      <span id="msg"></span>
    </div>

    <div class="sec">连接</div>
    <label class="f"><span>平台地址 <em>host</em></span><input id="host" placeholder="https://ivec-ai.com"></label>
    <label class="f"><span>凭证 <em>key</em></span></label>
    <div class="row">
      <input id="key" placeholder="host key" aria-label="凭证 key">
      <button id="btnGet" class="mini ghost" title="打开平台设备页获取绑定 key">获取</button>
    </div>

    <div class="sec">运行</div>
    <label class="f"><span>工作目录 <em>work_dir</em></span><input id="work_dir"
        placeholder="留空 = 系统临时目录"></label>
    <label class="f"><span>后台超时 <em>exec_timeout</em></span><input id="exec_timeout"
        placeholder="留空 = 30m（如 30s / 5m / 1h）"></label>
    <div class="f">
      <span>浏览器 <em>chromium</em></span>
      <input id="browser_path" placeholder="Chrome 路径（留空自动查找，下次启动浏览器生效）" aria-label="Chrome 可执行文件">
      <div class="grid-size">
        <span class="hint" style="margin:0">分辨率（宽 × 高）</span>
        <input type="number" id="browser_width" min="320" max="4096" step="1" placeholder="1280" aria-label="浏览器宽度">
        <input type="number" id="browser_height" min="320" max="4096" step="1" placeholder="720" aria-label="浏览器高度">
      </div>
      <p class="hint">默认 1280 × 720，新建标签时生效；页面尺寸固定，显示区域自动等比例缩放。</p>
    </div>
    <label class="f"><span>默认打开地址 <em>home_path</em></span><input id="home_path"
        placeholder="留空 = /（如 /、/a）"></label>

    <div class="sec">访问授权</div>
    <p class="hint">deny 恒优先：policy=deny 仅 allow 放行，policy=open 除 deny 全放。保存后重启后端子进程生效。</p>
    <div id="auth"></div>
  </div>

  <script>
    // ---- 设置桥（settings-preload → IPC local:api → 主进程） ----
    const bridge = (window.aicDesktop && window.aicDesktop.api) || null
    const call = (name, args) => {
      if (!bridge) return Promise.reject(new Error('设置桥不可用（请在 AIC Desktop 中打开设置）'))
      return Promise.resolve(bridge(name, args === undefined ? null : args))
    }
    const $pod = {
      get_config: () => call('get_config'),
      set_config: (cfg) => call('set_config', cfg),
      bind: (credential) => call('bind', { credential }),
      unbind: () => call('unbind', {}),
      get_status: () => call('get_status'),
      get_log: () => call('get_log'),
      check_host: (host) => call('check_host', { host }),
      start: () => call('start', {}),
      stop: () => call('stop', {}),
    }

    const $ = (id) => document.getElementById(id)
    const card = $('card')
    const msgEl = $('msg')
    const saveBtn = $('btnSave')

    const setMsg = (text, kind) => {
      msgEl.textContent = text
      msgEl.title = text
      msgEl.style.color = kind === 'warn' ? 'var(--warn)' : kind === 'ok' ? 'var(--ok)' : kind === 'err' ? 'var(--danger)' : 'var(--fg3)'
    }

    // 调用失败分类：桥/主进程异常（重启窗口内）→ 提示重试；业务错误 = 后端校验消息
    const isNetErr = (e) => e instanceof TypeError || /failed to fetch|network|invoke|不可用/i.test((e && e.message) || '')

    // ---- 脏检查：只有改动过才显示「保存」 ----
    // 表单字段 + 三域授权（policy/deny/allow）全量快照；列表编辑器的「新增输入框」不计入。
    const FIELDS = ['host', 'key', 'work_dir', 'exec_timeout', 'browser_path', 'browser_width', 'browser_height', 'home_path']
    const domains = [
      { key: 'fs', name: '文件 (fs)', ph: '路径或 glob，如 /Users/x/proj 或 **/.env' },
      { key: 'net', name: '网络 (net)', ph: 'host:port，如 example.com:443' },
      { key: 'ssh', name: 'SSH (ssh)', ph: 'host[:port]，如 192.168.1.10' },
    ]
    const auth = {
      fs: { policy: 'deny', deny: [], allow: [] },
      net: { policy: 'open', deny: [], allow: [] },
      ssh: { policy: 'deny', deny: [], allow: [] },
    }
    let baseline = ''
    const snapshot = () => JSON.stringify([
      FIELDS.map((id) => $(id).value.trim()),
      domains.map((d) => [auth[d.key].policy, auth[d.key].deny, auth[d.key].allow]),
    ])
    const refreshDirty = () => {
      const dirty = snapshot() !== baseline
      saveBtn.hidden = !dirty
      if (dirty) saveBtn.disabled = false
    }
    const markClean = () => { baseline = snapshot(); refreshDirty() }
    card.addEventListener('input', refreshDirty)
    card.addEventListener('change', refreshDirty)

    // ---- 授权列表编辑器（policy + 拒绝/允许两张名单） ----
    const listEl = (d, st, kind, title) => {
      const wrap = document.createElement('div')
      wrap.className = 'alist'
      const lbl = document.createElement('div')
      lbl.className = 'lbl'
      lbl.textContent = `${title} (${d.key}_${kind})`
      wrap.appendChild(lbl)
      const ul = document.createElement('div')
      ul.className = 'entries'
      st[kind].forEach((item, i) => {
        const row = document.createElement('div')
        row.className = 'entry'
        const t = document.createElement('span')
        t.textContent = item
        const del = document.createElement('button')
        del.className = 'x'
        del.textContent = '×'
        del.title = '删除'
        del.onclick = () => { st[kind].splice(i, 1); renderAuth() }
        row.appendChild(t)
        row.appendChild(del)
        ul.appendChild(row)
      })
      wrap.appendChild(ul)
      const row = document.createElement('div')
      row.className = 'row'
      const inp = document.createElement('input')
      inp.placeholder = d.ph
      inp.dataset.transient = '1' // 新增输入框不算「改动」
      const add = document.createElement('button')
      add.className = 'mini ghost'
      add.textContent = '添加'
      const doAdd = () => {
        const v = inp.value.trim()
        if (!v || st[kind].includes(v)) return
        st[kind].push(v)
        renderAuth()
      }
      add.onclick = doAdd
      inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd() } }
      row.appendChild(inp)
      row.appendChild(add)
      wrap.appendChild(row)
      return wrap
    }

    const renderAuth = () => {
      const root = $('auth')
      root.innerHTML = ''
      for (const d of domains) {
        const st = auth[d.key]
        const box = document.createElement('div')
        box.className = 'domain'
        box.dataset.k = d.key
        const head = document.createElement('div')
        head.className = 'dhead'
        const name = document.createElement('span')
        name.className = 'dname'
        name.textContent = d.name
        const sel = document.createElement('select')
        for (const v of ['deny', 'open']) {
          const op = document.createElement('option')
          op.value = v
          op.textContent = v === 'deny' ? 'deny（仅允许名单放行）' : 'open（除拒绝名单全放）'
          sel.appendChild(op)
        }
        sel.value = st.policy
        sel.onchange = () => { st.policy = sel.value }
        head.appendChild(name)
        head.appendChild(sel)
        box.appendChild(head)
        box.appendChild(listEl(d, st, 'deny', '拒绝'))
        box.appendChild(listEl(d, st, 'allow', '允许'))
        root.appendChild(box)
      }
      refreshDirty()
    }

    // ---- 状态 / 载入 ----
    const setStatus = (running, text, title) => {
      $('status').className = 'pill ' + (running ? 'on' : 'off')
      $('stext').textContent = text
      $('status').title = title || text
    }

    const refreshStatus = async () => {
      try {
        const s = await $pod.get_status()
        if (s.running) {
          setStatus(true, '已连接 ' + (s.host_id ? s.host_id.slice(0, 8) : '') + (s.version ? ' · ' + s.version : ''),
            '已连接' + (s.host_id ? ' ' + s.host_id : '') + (s.hostname ? ' @' + s.hostname : '') + (s.version ? ' · ' + s.version : ''))
        } else {
          setStatus(false, '未连接' + (s.host_id ? ' · ' + s.host_id.slice(0, 8) : ''), '未连接（无有效凭证或后端未运行）')
        }
      } catch (e) {
        setStatus(false, '状态获取失败', '状态获取失败: ' + e.message)
      }
    }

    const boot = async () => {
      try {
        const cfg = await $pod.get_config()
        $('host').value = cfg.host || ''
        $('key').value = cfg.key || ''
        $('work_dir').value = cfg.work_dir || ''
        $('exec_timeout').value = cfg.exec_timeout || ''
        $('home_path').value = cfg.home_path || '/'
        $('browser_path').value = cfg.browser_path || ''
        $('browser_width').value = cfg.browser_width || 1280
        $('browser_height').value = cfg.browser_height || 720
        for (const d of domains) {
          auth[d.key].policy = cfg[d.key + '_policy'] || auth[d.key].policy
          auth[d.key].deny = cfg[d.key + '_deny'] || []
          auth[d.key].allow = cfg[d.key + '_allow'] || []
        }
        renderAuth()
        markClean() // 载入完成 = 无改动（保存按钮此时隐藏）
      } catch (e) { setMsg('加载失败: ' + e.message, 'err') }
      refreshStatus()
    }

    // 窗口重新获得焦点 → 刷新连接状态（不重拉 get_config，避免覆盖正在编辑的输入框）
    window.addEventListener('focus', () => refreshStatus())

    // ---- 保存：先落盘（set_config）→ 凭证非空才 bind（同值幂等）；主进程随后自动重启后端子进程 ----
    const save = async () => {
      saveBtn.disabled = true
      const host = $('host').value.trim()
      const key = $('key').value.trim()
      const work_dir = $('work_dir').value.trim()
      const exec_timeout = $('exec_timeout').value.trim()
      const home_path = $('home_path').value.trim()
      try {
        const browser_width = Number($('browser_width').value || 1280)
        const browser_height = Number($('browser_height').value || 720)
        if (![browser_width, browser_height].every(n => Number.isInteger(n) && n >= 320 && n <= 4096)) {
          throw new Error('浏览器宽高必须是 320–4096 之间的整数')
        }
        const body = { host, work_dir, exec_timeout, home_path, browser_width, browser_height, browser_path: $('browser_path').value.trim() }
        for (const d of domains) {
          body[d.key + '_policy'] = auth[d.key].policy
          body[d.key + '_deny'] = auth[d.key].deny
          body[d.key + '_allow'] = auth[d.key].allow
        }
        await $pod.set_config(body)
      } catch (e) {
        setMsg(isNetErr(e) ? '设置桥暂不可用（后端可能正在重启），请重试' : '保存失败: ' + e.message, 'err')
        saveBtn.disabled = false
        refreshStatus()
        return
      }
      if (key) {
        try {
          await $pod.bind(key)
        } catch (e) {
          setMsg('地址已保存；凭证未生效: ' + e.message, 'warn')
          markClean()
          refreshStatus()
          return
        }
      }
      setMsg('已保存', 'ok')
      markClean() // 基线刷新 → 保存按钮消失
      refreshStatus()
    }

    // 归一平台地址（补 scheme + 去尾斜杠）
    const normalizeHost = (raw) => {
      let h = (raw || 'https://ivec-ai.com').trim()
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(h)) h = 'https://' + h
      return h.replace(/\/+$/, '')
    }

    // 探测 {host}/root.html 可达后打开平台（Electron：主窗口跳转、配置页保留）
    const probeAndJump = async (rawHost, failMsg) => {
      const h = normalizeHost(rawHost)
      let ok = false
      if (window.aicDesktop && window.aicDesktop.checkPlatform) {
        const r = await window.aicDesktop.checkPlatform(h)
        ok = !!(r && r.ok)
      } else {
        try {
          const r = await $pod.check_host({ host: h })
          ok = !!(r && r.ok)
        } catch (e) { ok = false }
      }
      if (ok) {
        const url = h + '/hosts'
        if (window.aicDesktop && window.aicDesktop.openPlatform) window.aicDesktop.openPlatform(url)
        else window.open(url, '_blank')
        return true
      }
      setMsg(failMsg || '平台不可达，请检查地址', 'err')
      return false
    }

    // 获取：打开 {host}/hosts 设备页拿绑定 key（桌面主窗口打开、配置页保留）
    $('btnGet').onclick = () => { probeAndJump($('host').value.trim()) }

    const reconnect = async () => {
      const btn = $('btnReconnect')
      btn.disabled = true
      setMsg('重连中…')
      try {
        await $pod.stop()
        await $pod.start()
        setMsg('已重连', 'ok')
      } catch (e) { setMsg('重连失败: ' + e.message, 'err') }
      btn.disabled = false
      refreshStatus()
    }

    $('btnTheme').onclick = () => window.__theme.cycle()
    saveBtn.onclick = save
    $('btnReconnect').onclick = reconnect
    window.__theme.apply() // 头部按钮就绪后同步主题标签

    if (!bridge) setMsg('设置桥不可用（请在 AIC Desktop 中打开设置）', 'err')
    boot()
  </script>
</body>

</html>
