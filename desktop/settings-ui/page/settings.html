<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>AIC 本地设置</title>
  <style>
    /* vhtml 组件样式默认只命中模板编译期节点（选择器被自动追加 [vrefof=组件URL]）；
       renderAuth/listEl 用 createElement 运行时创建的节点不带该标记 → 全部选择器
       加 body 前缀走作用域穿透（编译为宿主 [vref] 后代选择器），动静节点通吃。 */
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      background: var(--bg-color-secondary, #1e2128);
    }

    body .card {
      width: min(520px, 100%);
      box-sizing: border-box;
      margin: auto;
      padding: 28px 32px
    }

    body h1 {
      font-size: 17px;
      margin: 0 0 4px
    }

    body .sub {
      color: var(--text-color-tertiary, #8b919c);
      font-size: 12px;
      margin-bottom: 18px
    }

    body label {
      display: block;
      margin: 12px 0 4px;
      color: var(--text-color-secondary, #aab0ba);
      font-size: 13px
    }

    body input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 8px;
      background: var(--bg-color, #16181d);
      color: var(--text-color, #e8eaed);
      font-size: 13px
    }

    body input:focus {
      outline: none;
      border-color: #4b83f6
    }

    body .row {
      display: flex;
      gap: 8px
    }

    body .row input {
      flex: 1
    }

    body select {
      padding: 5px 8px;
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 8px;
      background: var(--bg-color, #16181d);
      color: var(--text-color, #e8eaed);
      font-size: 12px
    }

    body .auth-title {
      margin: 22px 0 2px;
      font-size: 14px;
      color: var(--text-color, #e8eaed)
    }

    body .auth-hint {
      color: var(--text-color-tertiary, #8b919c);
      font-size: 12px
    }

    body .domain {
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 10px;
      padding: 10px 12px 12px;
      margin-top: 12px
    }

    body .dhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    body .dname {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color, #e8eaed)
    }

    body .alist label {
      margin-top: 8px
    }

    body .alist input {
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    body .entries:empty {
      display: none
    }

    body .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    body .entry span {
      flex: 1;
      word-break: break-all;
      color: var(--text-color-secondary, #aab0ba)
    }

    body button.x {
      padding: 0 6px;
      background: transparent;
      color: var(--text-color-tertiary, #8b919c);
      font-size: 14px
    }

    body button.x:hover {
      background: transparent;
      color: #f87171
    }

    body .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--text-color-secondary, #aab0ba)
    }

    body .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      flex: none
    }

    body .dot.on {
      background: #4ade80
    }

    body .dot.off {
      background: #f87171
    }

    body #stext {
      flex: 1
    }

    body .btns {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      align-items: center
    }

    body button {
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #3b6ef6;
      color: #fff;
      font-size: 13px;
      cursor: pointer
    }

    body button:hover {
      background: #2f5cd8
    }

    body button:disabled {
      opacity: .5;
      cursor: default
    }

    body button.ghost {
      background: transparent;
      border: 1px solid var(--border-color, #3a3f4a);
      color: var(--text-color-secondary, #c6cbd4)
    }

    body button.ghost:hover {
      border-color: #4b83f6
    }

    body #msg {
      font-size: 12px;
      margin-left: auto
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>AIC 本地设置</h1>
    <div class="sub">本机客户端配置 · 平台不可达时依然可用</div>
    <div class="status"><span class="dot" id="sdot" ref="sdot"></span><span id="stext" ref="stext">检查中…</span></div>
    <label>平台地址 (host)</label>
    <input id="host" ref="host" placeholder="https://ivec-ai.com">
    <label>凭证 (key)</label>
    <div class="row">
      <input id="key" ref="key" placeholder="host key">
      <button @click="getKey()" style="white-space:nowrap" title="打开平台设备页获取绑定 key">获取</button>
    </div>
    <label>工作目录 (work_dir)</label>
    <input id="work_dir" ref="work_dir" placeholder="留空 = 系统临时目录">
    <label>后台超时 (exec_timeout)</label>
    <input id="exec_timeout" ref="exec_timeout" placeholder="留空 = 30m（如 30s / 5m / 1h）">
    <label>浏览器分辨率（宽 × 高）</label>
    <div class="row">
      <input type="text" ref="browser_path" aria-label="Chrome 可执行文件" placeholder="Chrome 路径（留空自动查找，下次启动浏览器生效）">
      <input type="number" min="320" max="4096" step="1" ref="browser_width" aria-label="浏览器宽度" placeholder="1280">
      <span>×</span>
      <input type="number" min="320" max="4096" step="1" ref="browser_height" aria-label="浏览器高度" placeholder="720">
    </div>
    <div class="sub">默认 1280 × 720，新建标签时生效。页面尺寸固定，显示区域自动等比例缩放。</div>
    <label>默认打开地址 (home_path)</label>
    <input id="home_path" ref="home_path" placeholder="留空 = /（如 /、/a）">
    <div class="auth-title">访问授权</div>
    <div class="auth-hint">deny 恒优先：policy=deny 仅 allow 放行，policy=open 除 deny 全放。保存即生效。</div>
    <div id="auth" ref="auth"></div>
    <div class="btns">
      <button @click="save()">保存</button>
      <button id="btnReconnect" ref="btnReconnect" @click="reconnect()">重连</button>
      <button v-if="canClose" class="ghost" @click="closePanel()">关闭</button>
      <span id="msg" ref="msg"></span>
    </div>
  </div>
</body>
<script setup>
  // 设置读写经 Electron 桥：$mod.$pod.* → settings-preload → 主进程 spawn
  // `aic-backend config|bind|unbind` 子命令写 config.yaml；保存/绑定后主进程自动重启后端子进程
  setMsg = (text, ok) => {
    $refs.msg.textContent = text;
    if (ok === 'warn') $refs.msg.style.color = '#facc15';
    else $refs.msg.style.color = ok ? '#4ade80' : '#f87171';
  };

  // 调用失败分类：桥/主进程异常（重启窗口内）→ 提示重试；业务错误 = 后端校验消息
  isNetErr = (e) => e instanceof TypeError || /failed to fetch|network|invoke|不可用/i.test((e && e.message) || '');

  // 凭证脏检查基线（get_config 回填值）：与当前输入一致时保存不重绑
  loadedKey = '';

  // 三域授权（fs/net/ssh × policy/deny/allow）：boot 回填 get_config 九键，UI 编辑
  // 内存态，save 全量提交（空数组 = 清空，匹配后端 set_config 整体替换语义）。
  domains = [
    {key: 'fs', name: '文件 (fs)', ph: '路径或 glob，如 /Users/x/proj 或 **/.env'},
    {key: 'net', name: '网络 (net)', ph: 'host:port，如 example.com:443'},
    {key: 'ssh', name: 'SSH (ssh)', ph: 'host[:port]，如 192.168.1.10'},
  ];
  auth = {
    fs: {policy: 'deny', deny: [], allow: []},
    net: {policy: 'open', deny: [], allow: []},
    ssh: {policy: 'deny', deny: [], allow: []},
  };

  renderAuth = () => {
    const root = $refs.auth;
    root.innerHTML = '';
    for (const d of domains) {
      const st = auth[d.key];
      const box = document.createElement('div');
      box.className = 'domain';
      const head = document.createElement('div');
      head.className = 'dhead';
      const name = document.createElement('span');
      name.className = 'dname';
      name.textContent = d.name;
      const sel = document.createElement('select');
      for (const v of ['deny', 'open']) {
        const op = document.createElement('option');
        op.value = v;
        op.textContent = v === 'deny' ? 'deny（仅允许名单放行）' : 'open（除拒绝名单全放）';
        sel.appendChild(op);
      }
      sel.value = st.policy;
      sel.onchange = () => { st.policy = sel.value; };
      head.appendChild(name);
      head.appendChild(sel);
      box.appendChild(head);
      box.appendChild(listEl(d, st, 'deny', '拒绝'));
      box.appendChild(listEl(d, st, 'allow', '允许'));
      root.appendChild(box);
    }
  };

  // 单张名单编辑器：标签 + 条目行（等宽文本 + × 删除）+ 输入行（回车/按钮添加）
  listEl = (d, st, kind, title) => {
    const wrap = document.createElement('div');
    wrap.className = 'alist';
    const lab = document.createElement('label');
    lab.textContent = `${title} (${d.key}_${kind})`;
    wrap.appendChild(lab);
    const ul = document.createElement('div');
    ul.className = 'entries';
    st[kind].forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'entry';
      const t = document.createElement('span');
      t.textContent = item;
      const del = document.createElement('button');
      del.className = 'x';
      del.textContent = '×';
      del.onclick = () => { st[kind].splice(i, 1); renderAuth(); };
      row.appendChild(t);
      row.appendChild(del);
      ul.appendChild(row);
    });
    wrap.appendChild(ul);
    const row = document.createElement('div');
    row.className = 'row';
    const inp = document.createElement('input');
    inp.placeholder = d.ph;
    const add = document.createElement('button');
    add.className = 'ghost';
    add.style.whiteSpace = 'nowrap';
    add.textContent = '添加';
    const doAdd = () => {
      const v = inp.value.trim();
      if (!v || st[kind].includes(v)) return;
      st[kind].push(v);
      renderAuth();
    };
    add.onclick = doAdd;
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
    row.appendChild(inp);
    row.appendChild(add);
    wrap.appendChild(row);
    return wrap;
  };

  refreshStatus = async () => {
    try {
      const s = await $mod.$pod.get_status();
      if (s.running) {
        $refs.sdot.className = 'dot on';
        $refs.stext.textContent = '已连接 ' + (s.host_id || '') + (s.hostname ? ' @' + s.hostname : '') + (s.version ? ' · ' + s.version : '');
      } else {
        $refs.sdot.className = 'dot off';
        $refs.stext.textContent = '未连接' + (s.host_id ? '（host_id: ' + s.host_id + '）' : '');
      }
    } catch (e) {
      $refs.sdot.className = 'dot off';
      $refs.stext.textContent = '状态获取失败: ' + e.message;
    }
  };

  boot = async () => {
    try {
      const cfg = await $mod.$pod.get_config();
      $refs.host.value = cfg.host || '';
      $refs.key.value = cfg.key || '';
      loadedKey = cfg.key || '';
      $refs.work_dir.value = cfg.work_dir || '';
      $refs.exec_timeout.value = cfg.exec_timeout || '';
      $refs.home_path.value = cfg.home_path || '/';
      $refs.browser_path.value = cfg.browser_path || "";
      $refs.browser_width.value = cfg.browser_width || 1280;
      $refs.browser_height.value = cfg.browser_height || 720;
      for (const d of domains) {
        auth[d.key].policy = cfg[d.key + '_policy'] || auth[d.key].policy;
        auth[d.key].deny = cfg[d.key + '_deny'] || [];
        auth[d.key].allow = cfg[d.key + '_allow'] || [];
      }
      renderAuth();
    } catch (e) {setMsg('加载失败: ' + e.message, false);}
    refreshStatus();
  };
  boot();

  // 窗口重新获得焦点 → 刷新连接状态（不重拉 get_config，避免覆盖正在编辑的输入框）
  window.addEventListener('focus', () => refreshStatus());

  // 保存：先落盘（set_config）→ 凭证改动过才 bind；不跳转、不关闭页面（原地提示）。
  // 连接/绑定失败都不回滚、不阻断已保存的配置（2026-09-09 修复：原先 bind 在前，
  // 旧凭证连旧地址失败会中断 set_config，导致改地址保存不了）。
  save = async () => {
    const host = $refs.host.value.trim();
    const key = $refs.key.value.trim();
    const work_dir = $refs.work_dir.value.trim();
    const exec_timeout = $refs.exec_timeout.value.trim();
    const home_path = $refs.home_path.value.trim();
    try {
      const browser_width = Number($refs.browser_width.value || 1280);
      const browser_height = Number($refs.browser_height.value || 720);
      if (![browser_width, browser_height].every(n => Number.isInteger(n) && n >= 320 && n <= 4096)) {
        throw new Error('浏览器宽高必须是 320–4096 之间的整数');
      }
      const body = {host, work_dir, exec_timeout, home_path, browser_width, browser_height, browser_path: $refs.browser_path.value.trim()};
      for (const d of domains) {
        body[d.key + '_policy'] = auth[d.key].policy;
        body[d.key + '_deny'] = auth[d.key].deny;
        body[d.key + '_allow'] = auth[d.key].allow;
      }
      await $mod.$pod.set_config(body);
    } catch (e) {
      setMsg(isNetErr(e) ? '设置桥暂不可用（后端可能正在重启），请重试' : '保存失败: ' + e.message, false);
      refreshStatus();
      return;
    }
    if (key && key !== loadedKey) {
      try {
        await $mod.$pod.bind(key);
        loadedKey = key;
      } catch (e) {
        setMsg('地址已保存；凭证未生效: ' + e.message, 'warn');
        refreshStatus();
        return;
      }
    }
    setMsg('已保存', true);
    refreshStatus();
  };

  // 归一平台地址（补 scheme + 去尾斜杠）
  normalizeHost = (raw) => {
    let h = (raw || 'https://ivec-ai.com').trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(h)) h = 'https://' + h;
    return h.replace(/\/+$/, '');
  };

  // 探测 {host}/root.html 可达后打开平台（Electron：主窗口跳转、配置页保留；
  // 浏览器：新标签）。failMsg：不可达时的红色提示。
  probeAndJump = async (rawHost, failMsg) => {
    const h = normalizeHost(rawHost);
    let ok = false;
    if (window.aicDesktop && window.aicDesktop.checkPlatform) {
      const r = await window.aicDesktop.checkPlatform(h);
      ok = !!(r && r.ok);
    } else {
      try {
        const r = await $mod.$pod.check_host(h);
        ok = !!(r && r.ok);
      } catch (e) {ok = false;}
    }
    if (ok) {
      const url = h + '/hosts';
      if (window.aicDesktop && window.aicDesktop.openPlatform) {
        window.aicDesktop.openPlatform(url);
      } else {
        window.open(url, '_blank');
      }
      return true;
    }
    setMsg(failMsg || '平台不可达，请检查地址', false);
    return false;
  };

  getKey = () => {
    // 获取：打开 {host}/hosts 设备页拿绑定 key（桌面主窗口打开、配置页保留；浏览器新标签）
    probeAndJump($refs.host.value.trim());
  };

  reconnect = async () => {
    $refs.btnReconnect.disabled = true;
    try {
      await $mod.$pod.stop();
      await $mod.$pod.start();
      setMsg('已重连', true);
    } catch (e) {setMsg('重连失败: ' + e.message, false);}
    $refs.btnReconnect.disabled = false;
    refreshStatus();
  };

  // 桌面端独立配置窗口提供「关闭」（浏览器直开无 aicDesktop.closeSettings → 不渲染）。
  // 声明式渲染：setup 在 DOM 编译前执行、$refs 不可用（vhtml 契约），桥条件只能走 $data 标记 + 模板 v-if
  //（2026-09-10 事故：setup 里直接改 $refs.btnClose.style 导致按钮恒隐藏）。
  canClose = !!(window.aicDesktop && window.aicDesktop.closeSettings);
  closePanel = () => {
    if (window.aicDesktop && window.aicDesktop.closeSettings) window.aicDesktop.closeSettings();
  };
</script>

</html>
