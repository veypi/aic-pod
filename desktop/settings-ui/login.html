<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
  <title>ivec.ai</title>
  <style>
    :root { color-scheme: light; --bg:#f3f5f9; --card:#fff; --fg:#142033; --muted:#6d7787; --line:#dfe4ec; --brand:#245fd1; --danger:#c73535; }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#11141a; --card:#1b1f27; --fg:#edf1f7; --muted:#9aa4b2; --line:#323844; --brand:#8aafff; --danger:#ff9696; } }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif }
    main { width:min(430px,100%); padding:36px 28px; position:relative }
    .settings { position:absolute; right:20px; top:18px; border:0; background:transparent; color:var(--muted); font-size:20px; cursor:pointer }
    .brand { text-align:center; margin:18px 0 30px }
    .logo { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 12px; border-radius:17px; background:var(--fg); color:var(--bg); font-size:25px; font-weight:750 }
    h1 { font-size:23px; margin:0 0 5px }
    .sub { color:var(--muted); margin:0 }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 18px 50px -38px #000 }
    .tabs { display:flex; padding:3px; background:var(--bg); border-radius:9px; margin-bottom:17px }
    .tabs button { flex:1; border:0; padding:7px; background:transparent; color:var(--muted); border-radius:7px; cursor:pointer }
    .tabs button.active { background:var(--card); color:var(--fg); font-weight:600 }
    label { display:block; margin:11px 0 6px; color:var(--muted); font-size:12px }
    input { width:100%; height:43px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--fg); font:inherit; outline:none }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 13%,transparent) }
    .code-row { display:flex; gap:8px }
    .code-row input { flex:1 }
    .code-row button { width:112px; margin-top:0 }
    button.primary,button.secondary { width:100%; min-height:43px; border-radius:9px; padding:9px 12px; cursor:pointer; font:inherit }
    button.primary { border:0; background:var(--brand); color:var(--card); font-weight:650; margin-top:18px }
    button.secondary { border:1px solid var(--line); background:transparent; color:var(--fg); margin-top:10px }
    button:disabled { opacity:.5; cursor:default }
    .link { border:0; background:transparent; color:var(--brand); padding:0; cursor:pointer; font:inherit }
    .forgot { text-align:right; margin-top:10px; font-size:12px }
    .switch { text-align:center; margin-top:17px; color:var(--muted); font-size:13px }
    .consent { display:flex; gap:7px; align-items:flex-start; margin-top:15px; color:var(--muted); font-size:12px }
    .consent input { width:15px; height:15px; margin:2px 0 0; flex:none }
    .error { color:var(--danger); white-space:pre-wrap; margin:13px 0 0; font-size:12px }
    .server { color:var(--muted); text-align:center; font-size:11px; margin-top:20px; word-break:break-all }
    .account { margin-bottom:15px }
    .account-name { font-size:17px; font-weight:650; margin:3px 0 }
    .meta { color:var(--muted); font-size:12px; word-break:break-all }
    [hidden] { display:none!important }
  </style>
</head>
<body>
<main>
  <button class="settings" id="settings" aria-label="Settings">⚙</button>
  <div class="brand"><div class="logo">iv</div><h1 id="appName">ivec.ai</h1><p class="sub" id="subtitle"></p></div>
  <section class="card" id="formCard">
    <div class="tabs" id="tabs"><button id="passwordTab"></button><button id="codeTab"></button></div>
    <form id="form">
      <div id="identityFields">
        <label id="accountLabel" for="account"></label><input id="account" autocomplete="username">
        <div id="passwordWrap"><label id="passwordLabel" for="password"></label><input id="password" type="password" autocomplete="current-password"></div>
        <div id="confirmWrap" hidden><label id="confirmLabel" for="confirm"></label><input id="confirm" type="password" autocomplete="new-password"></div>
      </div>
      <div id="codeFields" hidden>
        <label id="targetLabel" for="target"></label>
        <div class="code-row"><input id="target" autocomplete="username"><button type="button" class="secondary" id="sendCode"></button></div>
        <label id="codeLabel" for="code"></label><input id="code" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <div id="registerContacts" hidden>
        <div id="emailWrap"><label for="email">Email</label><input id="email" type="email"></div>
        <div id="emailCodeWrap"><label for="emailCode">Email code</label><div class="code-row"><input id="emailCode" inputmode="numeric"><button type="button" class="secondary" id="sendEmailCode">Send</button></div></div>
        <div id="phoneWrap"><label for="phone">Phone</label><input id="phone" type="tel"></div>
        <div id="phoneCodeWrap"><label for="phoneCode">Phone code</label><div class="code-row"><input id="phoneCode" inputmode="numeric"><button type="button" class="secondary" id="sendPhoneCode">Send</button></div></div>
      </div>
      <div class="forgot" id="forgotWrap"><button type="button" class="link" id="forgot"></button></div>
      <div class="consent" id="consentWrap" hidden><input id="consent" type="checkbox"><span id="consentText"></span></div>
      <button class="primary" id="submit" type="submit"></button>
      <div class="switch"><button type="button" class="link" id="switchMode"></button></div>
    </form>
  </section>
  <section class="card" id="connectedCard" hidden>
    <div class="account"><div class="meta" id="currentLabel"></div><div class="account-name" id="accountName"></div><div class="meta" id="hostInfo"></div></div>
    <button class="primary" id="retry"></button>
    <button class="secondary" id="switchAccount"></button>
  </section>
  <div class="error" id="error" role="alert"></div>
  <div class="server" id="server"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id)
  const call = (method, params) => window.aicNative.call(method, params)
  let config = null
  let texts = {}
  let state = null
  let registering = false
  let useCode = false
  let busy = false
  let countdown = 0
  const cooling = new Set()
  const t = key => texts[key] || key
  const error = value => { $('error').textContent = value || '' }

  function setBusy(value) {
    busy = value
    for (const id of ['submit','retry','switchAccount','sendCode','sendEmailCode','sendPhoneCode']) $(id).disabled = value || cooling.has(id)
  }

  function legalLink(label, url) {
    const a = document.createElement('a')
    a.href = '#'
    a.className = 'link'
    a.textContent = label
    a.onclick = event => { event.preventDefault(); call('open_external', { url }) }
    return a
  }

  function renderLegal() {
    const root = $('consentText')
    root.replaceChildren()
    const documents = []
    if (config.termsURL) documents.push([t('login.terms'), config.termsURL])
    if (config.privacyURL) documents.push([t('login.privacy'), config.privacyURL])
    $('consentWrap').hidden = documents.length === 0
    if (!documents.length) return
    root.append(document.createTextNode(t('login.agree') + ' '))
    documents.forEach(([label,url], index) => {
      if (index) root.append(document.createTextNode(' ' + t('login.and') + ' '))
      root.append(legalLink(label,url))
    })
  }

  function render() {
    if (!config || !state) return
    $('appName').textContent = t('app.name')
    $('subtitle').textContent = t('login.subtitle')
    $('passwordTab').textContent = t('login.password')
    $('codeTab').textContent = t('login.code')
    $('accountLabel').textContent = registering ? t('login.account') : t('login.account')
    $('passwordLabel').textContent = t('login.password_value')
    $('confirmLabel').textContent = t('login.confirm_password')
    $('targetLabel').textContent = t('login.target')
    $('codeLabel').textContent = t('login.code_value')
    $('sendCode').textContent = countdown > 0 ? countdown + 's' : t('login.send_code')
    $('forgot').textContent = t('login.forgot')
    $('submit').textContent = registering ? t('login.register') : t('login.submit')
    $('switchMode').textContent = registering ? t('login.have_account') : t('login.no_account')
    $('retry').textContent = t('login.retry')
    $('switchAccount').textContent = t('login.switch')
    $('currentLabel').textContent = t('login.current')
    $('server').textContent = t('login.server') + ': ' + state.server
    $('formCard').hidden = !!state.signedIn
    $('connectedCard').hidden = !state.signedIn
    if (state.signedIn) {
      $('accountName').textContent = state.user?.nickname || state.user?.username || state.user?.id || ''
      $('hostInfo').textContent = state.host_id ? t('login.host') + ': ' + state.host_id : t('login.connecting')
      return
    }
    $('tabs').hidden = registering || !(config.passwordLogin && (config.emailCodeLogin || config.smsCodeLogin))
    $('passwordTab').classList.toggle('active', !useCode)
    $('codeTab').classList.toggle('active', useCode)
    $('identityFields').hidden = useCode && !registering
    $('passwordWrap').hidden = useCode && !registering
    $('codeFields').hidden = !useCode || registering
    $('confirmWrap').hidden = !registering
    $('registerContacts').hidden = !registering
    $('emailWrap').hidden = !config.requireEmail
    $('emailCodeWrap').hidden = !config.requireEmail
    $('phoneWrap').hidden = !config.requirePhone
    $('phoneCodeWrap').hidden = !config.requirePhone
    $('forgotWrap').hidden = registering || useCode
    $('switchMode').hidden = !config.registration
    $('password').autocomplete = registering ? 'new-password' : 'current-password'
    renderLegal()
  }

  async function bootstrap() {
    try {
      const result = await call('bootstrap')
      config = result.config
      state = result.state
      texts = result.texts || {}
      document.documentElement.lang = result.locale || 'zh-CN'
      if (state.error) error(state.error)
      render()
    } catch (e) { error(e.message) }
  }

  $('settings').onclick = () => call('open_settings')
  $('passwordTab').onclick = () => { useCode = false; registering = false; error(''); render() }
  $('codeTab').onclick = () => { useCode = true; registering = false; error(''); render() }
  $('switchMode').onclick = () => { registering = !registering; useCode = false; error(''); render() }
  $('forgot').onclick = () => call('open_external', { url: state.server + '/vb/forgot-password' })
  $('retry').onclick = async () => { setBusy(true); error(''); try { await call('retry') } catch (e) { error(e.message) } finally { setBusy(false); await bootstrap() } }
  $('switchAccount').onclick = async () => { setBusy(true); try { await call('switch_account'); state = null; await bootstrap() } catch (e) { error(e.message) } finally { setBusy(false) } }

  async function sendCode(type, target, purpose, button) {
    if (!target) return error(t('login.required'))
    setBusy(true)
    button.disabled = true
    try {
      await call('send_code', { type, target, purpose })
      let remaining = 60
      cooling.add(button.id)
      const previous = button.textContent
      button.textContent = remaining + 's'
      const timer = setInterval(() => {
        remaining--
        button.textContent = remaining > 0 ? remaining + 's' : previous
        button.disabled = remaining > 0 || busy
        if (remaining <= 0) {
          cooling.delete(button.id)
          clearInterval(timer)
        }
      }, 1000)
    } catch (e) { error(e.message); button.disabled = false } finally { setBusy(false) }
  }

  $('sendCode').onclick = () => {
    const target = $('target').value.trim()
    return sendCode(target.includes('@') ? 'email' : 'sms', target, 'login', $('sendCode'))
  }
  $('sendEmailCode').onclick = () => sendCode('email', $('email').value.trim(), 'register', $('sendEmailCode'))
  $('sendPhoneCode').onclick = () => sendCode('sms', $('phone').value.trim(), 'register', $('sendPhoneCode'))

  $('form').onsubmit = async event => {
    event.preventDefault()
    if (busy) return
    if ($('consentWrap').hidden === false && !$('consent').checked) return error(t('login.consent'))
    setBusy(true); error('')
    try {
      if (registering) {
        if ($('password').value !== $('confirm').value) throw new Error(t('login.password_mismatch'))
        await call('register', {
          username: $('account').value.trim(), password: $('password').value,
          email: config.requireEmail ? $('email').value.trim() : '',
          phone: config.requirePhone ? $('phone').value.trim() : '',
          email_code: config.requireEmail ? $('emailCode').value.trim() : '',
          phone_code: config.requirePhone ? $('phoneCode').value.trim() : '',
        })
      } else if (useCode) {
        const target = $('target').value.trim()
        await call('login_code', { type: target.includes('@') ? 'email' : 'sms', target, code: $('code').value.trim() })
      } else {
        await call('login_password', { username: $('account').value.trim(), password: $('password').value })
      }
      $('password').value = ''
      $('confirm').value = ''
    } catch (e) {
      error(e.message)
      await bootstrap()
    } finally { setBusy(false) }
  }
  window.aicNative.onSync(() => bootstrap())
  bootstrap()
})()
</script>
</body>
</html>
