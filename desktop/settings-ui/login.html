<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self'; connect-src 'none'">
  <title>ivec.ai</title>
  <style>
    /* 窗口本身就是登录面板：直接平铺，不再外套一层卡片。 */
    :root { color-scheme: light; --bg:#f1f8ff; --card:#fff; --fill:rgba(20,32,51,.06); --fg:#142033; --muted:#6d7787; --line:#dfe4ec; --brand:#245fd1; --danger:#c73535; }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#11141a; --card:#1b1f27; --fill:rgba(255,255,255,.08); --fg:#edf1f7; --muted:#9aa4b2; --line:#323844; --brand:#8aafff; --danger:#ff9696; } }
    * { box-sizing:border-box }
    /* 三方品牌图标：Font Awesome Free 6.7.2 品牌字形（Icons CC BY 4.0 / Fonts SIL OFL 1.1）。
       只搬必要字形与码点，不引整套 FA CSS。 */
    @font-face {
      font-family: "Font Awesome 6 Brands";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("fa-brands-400.woff2") format("woff2");
    }
    .fab {
      font-family: "Font Awesome 6 Brands"; font-weight: 400; font-style: normal; line-height: 1;
      display: inline-block; font-variant: normal; text-rendering: auto;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    .fab-google:before { content: "\f1a0" }
    .fab-github:before { content: "\f09b" }
    .fab-weixin:before { content: "\f1d7" }
    .fab-apple:before { content: "\f179" }
    .fab-microsoft:before { content: "\f3ca" }
    .fab-x-twitter:before { content: "\e61b" }
    .fab-discord:before { content: "\f392" }
    .fab-qq:before { content: "\f1d6" }
    .fab-weibo:before { content: "\f18a" }
    .fab-alipay:before { content: "\f642" }
    .fab-gitlab:before { content: "\f296" }
    .fab-facebook:before { content: "\f39e" }
    .fab-linkedin:before { content: "\f0e1" }
    .fab-amazon:before { content: "\f270" }
    .fab-bitbucket:before { content: "\f171" }
    .fab-steam:before { content: "\f1b6" }
    .fab-twitch:before { content: "\f1e8" }
    .fab-reddit:before { content: "\f1a1" }
    .fab-git:before { content: "\f1d3" }
    .fab-android:before { content: "\f17b" }
    .fab-linux:before { content: "\f17c" }
    .fab-windows:before { content: "\f17a" }
    .fab-chrome:before { content: "\f268" }
    .fab-edge:before { content: "\f282" }
    html,body { height:100% }
    body {
      margin:0; padding:32px 20px 20px; background:var(--bg); color:var(--fg);
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      /* 顶部对齐：切换登录方式/注册时内容只向下展开，品牌区不会跟着跳。 */
      display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      scrollbar-width:none;
    }
    /* 表单比窗口高时仍可滚动，但不显示滚动条（原生窗口里没有滚动条才像 App）。 */
    body::-webkit-scrollbar { width:0; height:0 }
    .shell { width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; gap:26px; position:relative }
    .settings {
      position:absolute; top:-4px; right:-4px; border:0; background:transparent; color:var(--muted);
      font-size:17px; cursor:pointer; padding:6px; line-height:1;
    }
    .settings:hover { color:var(--fg) }
    .brand { display:flex; flex-direction:column; align-items:center; gap:10px }
    .brand img { width:52px; height:52px; display:block }
    .brand h1 { margin:0; font-size:18px; font-weight:650; letter-spacing:-0.01em }
    .card {
      width:100%;
    }
    .card h2 { margin:0 0 12px; font-size:17px; font-weight:650; text-align:center; letter-spacing:-0.01em }
    .social { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px }
    .social-btn {
      border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px;
      padding:8px 12px; border-radius:999px; cursor:pointer; max-width:100%;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    /* 图标按钮：与 vbase 网页登录页同为圆形品牌图标。 */
    .social-btn.icon {
      width:42px; height:42px; padding:0; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center; font-size:18px;
    }
    .social-btn.icon img { width:20px; height:20px; object-fit:contain; display:block }
    .social-btn:hover { border-color:var(--brand); color:var(--brand) }
    .social-btn:disabled { opacity:.5; cursor:default }
    .tip { display:none }
    .tabs { display:flex; gap:4px; padding:3px; background:var(--fill); border-radius:10px; margin-bottom:12px }
    .tabs button {
      flex:1; border:0; padding:7px 0; background:transparent; color:var(--muted);
      border-radius:8px; cursor:pointer; font:inherit; font-size:13px;
    }
    .tabs button.active { background:var(--card); color:var(--fg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08) }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 5px }
    input {
      width:100%; height:42px; padding:0 12px; border:1px solid var(--line); border-radius:10px;
      background:var(--card); color:var(--fg); font:inherit; outline:none;
    }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent) }
    .code-row { display:flex; gap:8px }
    .code-row input { flex:1 }
    .ghost {
      flex:0 0 auto; min-width:104px; height:42px; padding:0 12px; border:1px solid var(--line);
      border-radius:10px; background:var(--card); color:var(--fg); font:inherit; font-size:13px; cursor:pointer;
    }
    .ghost:hover:not(:disabled) { border-color:var(--brand); color:var(--brand) }
    .ghost:disabled { opacity:.5; cursor:default }
    .ghost.wide { width:100%; margin-top:10px }
    .consent { display:flex; gap:8px; align-items:flex-start; margin:12px 0 0; font-size:12px; color:var(--muted); line-height:1.5 }
    .consent input { flex:none; width:16px; height:16px; margin:1px 0 0; padding:0; border:0; background:none; accent-color:var(--brand) }
    .consent span { flex:1 }
    .consent a { color:var(--brand); text-decoration:underline; cursor:pointer }
    .error { color:var(--danger); font-size:12px; margin-top:12px; white-space:pre-wrap; text-align:left }
    .primary {
      width:100%; height:44px; margin-top:14px; border:0; border-radius:12px; background:var(--brand);
      color:#fff; font:inherit; font-weight:600; cursor:pointer;
    }
    .primary:disabled { opacity:.5; cursor:default }
    .foot { text-align:center; margin-top:10px; font-size:13px; color:var(--muted) }
    .link { border:0; background:none; color:var(--brand); font:inherit; cursor:pointer; padding:0 }
    .meta { font-size:13px; color:var(--muted); text-align:center; word-break:break-all; margin-top:4px }
    .meta.name { color:var(--fg); font-size:15px; font-weight:600 }
    [hidden] { display:none!important }
  </style>
</head>
<body>
<div class="shell">
  <button class="settings" id="settings" type="button" aria-label="Settings">⚙</button>
  <div class="brand">
    <img src="/assets/icon.png" alt="ivec.ai">
    <h1 id="appName">ivec.ai</h1>
  </div>

  <section class="card" id="formCard">
    <div class="social" id="social"></div>
    <div class="tabs" id="tabs">
      <button type="button" id="passwordTab"></button>
      <button type="button" id="codeTab"></button>
    </div>
    <form id="form" novalidate>
      <div id="identityFields">
        <label id="accountLabel" for="account"></label>
        <input id="account" autocomplete="username" spellcheck="false">
        <div id="passwordWrap">
          <label id="passwordLabel" for="password"></label>
          <input id="password" type="password" autocomplete="current-password">
        </div>
        <div id="confirmWrap" hidden>
          <label id="confirmLabel" for="confirm"></label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>
      </div>
      <div id="codeFields" hidden>
        <label id="targetLabel" for="target"></label>
        <div class="code-row">
          <input id="target" autocomplete="username" spellcheck="false">
          <button type="button" class="ghost" id="sendCode"></button>
        </div>
        <label id="codeLabel" for="code"></label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <div id="registerContacts" hidden>
        <div id="emailWrap" hidden>
          <label id="emailLabel" for="email"></label>
          <div class="code-row">
            <input id="email" type="email" autocomplete="email" spellcheck="false">
            <button type="button" class="ghost" id="sendEmailCode"></button>
          </div>
        </div>
        <div id="emailCodeWrap" hidden>
          <label id="emailCodeLabel" for="emailCode"></label>
          <input id="emailCode" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <div id="phoneWrap" hidden>
          <label id="phoneLabel" for="phone"></label>
          <div class="code-row">
            <input id="phone" type="tel" autocomplete="tel" spellcheck="false">
            <button type="button" class="ghost" id="sendPhoneCode"></button>
          </div>
        </div>
        <div id="phoneCodeWrap" hidden>
          <label id="phoneCodeLabel" for="phoneCode"></label>
          <input id="phoneCode" inputmode="numeric" autocomplete="one-time-code">
        </div>
      </div>
      <label class="consent" id="consentWrap" hidden>
        <input type="checkbox" id="consent">
        <span id="consentText"></span>
      </label>
      <div class="error" id="error" role="alert"></div>
      <button class="primary" id="submit" type="submit"></button>
      <div class="foot"><button type="button" class="link" id="forgot"></button></div>
      <div class="foot"><button type="button" class="link" id="switchMode"></button></div>
    </form>
  </section>

  <section class="card" id="connectedCard" hidden>
    <h2 id="connectedTitle"></h2>
    <div class="meta name" id="accountName"></div>
    <div class="meta" id="hostInfo"></div>
    <button class="primary" id="retry" type="button"></button>
    <button class="ghost wide" id="switchAccount" type="button"></button>
  </section>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id)
  const call = (method, params) => window.aicNative.call(method, params)
  // 主进程把业务错误包成 {ok:false, error:{message, serverCode}}（不丢业务码）；
  // 这里还原成异常对象，渲染层不用再认识 IPC 封装。
  const invoke = async (method, params) => {
    const result = await call(method, params)
    if (result && result.ok === false && result.error) {
      const failure = new Error(result.error.message || '')
      failure.serverCode = Number(result.error.serverCode) || 0
      throw failure
    }
    return result
  }
  // 错误文案：优先用平台业务码（error.<code>，与网页 $err 同一套语义），否则文原文。
  function describe(failure) {
    const code = failure && failure.serverCode
    if (code && texts['error.' + code]) return texts['error.' + code]
    const raw = String((failure && failure.message) || failure || '')
    return raw
      .replace(/^Error invoking remote method '[^']*':\s*/, '')
      .replace(/^[A-Za-z]*Error:\s*/, '')
  }
  let config = null
  let texts = {}
  let state = null
  let registering = false
  let useCode = false
  let busy = false
  let countdown = 0
  const cooling = new Set()
  const t = key => texts[key] || key
  const fill = (text, value) => String(text).replace('%@', value == null ? '' : String(value))
  const error = value => { $('error').textContent = value || '' }

  function setBusy(value) {
    busy = value
    for (const id of ['submit', 'retry', 'switchAccount', 'sendCode', 'sendEmailCode', 'sendPhoneCode']) {
      const element = $(id)
      if (element) element.disabled = value || cooling.has(id)
    }
    // 三方按钮不在上面的固定清单里（数量随配置变），单独同步一次。
    for (const button of $('social').querySelectorAll('button')) button.disabled = value
  }

  function legalLink(label, url) {
    const a = document.createElement('a')
    a.href = '#'
    a.textContent = label
    a.onclick = event => { event.preventDefault(); event.stopPropagation(); call('open_external', { url }) }
    return a
  }

  function renderLegal() {
    const root = $('consentText')
    root.replaceChildren()
    const documents = []
    if (config.termsURL) documents.push([t('login.terms'), config.termsURL])
    if (config.privacyURL) documents.push([t('login.privacy'), config.privacyURL])
    $('consentWrap').hidden = documents.length === 0
    if (!documents.length) return
    root.append(document.createTextNode(t('login.agree') + ' '))
    documents.forEach(([label, url], index) => {
      if (index) root.append(document.createTextNode(' ' + t('login.and') + ' '))
      root.append(legalLink(label, url))
    })
  }

  // 三方品牌图标：本地图标优先（微信 / 钉钉 / 飞书），其次 Font Awesome 品牌字形，
  // 都没有才退回文字按钮。
  const LOCAL_ICONS = { wechat: 'wechat.svg', weixin: 'wechat.svg', dingtalk: 'dingtalk.svg', feishu: 'feishu.png' }
  const BRAND_ICONS = {
    google: 'google', github: 'github', weixin: 'weixin', wechat: 'weixin',
    apple: 'apple', microsoft: 'microsoft', twitter: 'x-twitter', 'x-twitter': 'x-twitter',
    discord: 'discord', qq: 'qq', weibo: 'weibo', alipay: 'alipay', gitlab: 'gitlab',
    facebook: 'facebook', linkedin: 'linkedin', amazon: 'amazon', bitbucket: 'bitbucket',
    steam: 'steam', twitch: 'twitch', reddit: 'reddit', gitee: 'git', git: 'git',
    android: 'android', linux: 'linux', windows: 'windows', chrome: 'chrome', edge: 'edge',
  }

  function renderProviders() {
    const root = $('social')
    root.replaceChildren()
    const providers = Array.isArray(config.providers) ? config.providers : []
    root.hidden = providers.length === 0
    providers.forEach(provider => {
      const button = document.createElement('button')
      button.type = 'button'
      button.disabled = busy
      button.onclick = async () => {
        setBusy(true)
        error('')
        try {
          await invoke('third_party', { provider: provider.code })
        } catch (e) {
          error(describe(e))
          await bootstrap()
        } finally {
          setBusy(false)
        }
      }
      const key = String(provider.icon || provider.code || '').toLowerCase()
      const code = String(provider.code || '').toLowerCase()
      const localFile = LOCAL_ICONS[key] || LOCAL_ICONS[code]
      const brand = BRAND_ICONS[key] || BRAND_ICONS[code]
      if (localFile || brand) {
        button.className = 'social-btn icon'
        button.title = provider.name || provider.code
        button.setAttribute('aria-label', button.title)
        if (localFile) {
          const img = document.createElement('img')
          img.src = 'provider-icons/' + localFile
          img.alt = button.title
          button.append(img)
        } else {
          const icon = document.createElement('i')
          icon.className = 'fab fab-' + brand
          button.append(icon)
        }
      } else {
        button.className = 'social-btn'
        button.textContent = fill(t('login.with_provider'), provider.name || provider.code)
      }
      root.append(button)
    })
  }

  function render() {
    if (!config || !state) return
    $('appName').textContent = t('app.name')
    $('passwordTab').textContent = t('login.password')
    $('codeTab').textContent = t('login.code')
    $('accountLabel').textContent = t('login.account')
    $('passwordLabel').textContent = t('login.password_value')
    $('confirmLabel').textContent = t('login.confirm_password')
    $('targetLabel').textContent = t('login.target')
    $('codeLabel').textContent = t('login.code_value')
    $('emailLabel').textContent = t('login.email_label')
    $('emailCodeLabel').textContent = t('login.email_code_label')
    $('phoneLabel').textContent = t('login.phone_label')
    $('phoneCodeLabel').textContent = t('login.phone_code_label')
    $('sendCode').textContent = countdown > 0 ? countdown + 's' : t('login.send_code')
    $('forgot').textContent = t('login.forgot')
    $('submit').textContent = registering ? t('login.register') : t('login.submit')
    $('switchMode').textContent = registering ? t('login.have_account') : t('login.no_account')
    $('retry').textContent = t('login.retry')
    $('switchAccount').textContent = t('login.switch')
    $('connectedTitle').textContent = t('login.connected_title')

    $('formCard').hidden = !!state.signedIn
    $('connectedCard').hidden = !state.signedIn
    if (state.signedIn) {
      $('accountName').textContent = state.user?.nickname || state.user?.username || state.user?.id || ''
      $('hostInfo').textContent = state.host_id ? t('login.host') + ': ' + state.host_id : t('login.connecting')
      return
    }

    // 与 vbase 网页登录页一致：后台开了什么方式就显示什么。
    const codeLogin = config.emailCodeLogin || config.smsCodeLogin
    $('tabs').hidden = registering || !(config.passwordLogin && codeLogin)
    $('passwordTab').classList.toggle('active', !useCode)
    $('codeTab').classList.toggle('active', useCode)
    $('identityFields').hidden = useCode && !registering
    $('passwordWrap').hidden = useCode && !registering
    $('codeFields').hidden = !useCode || registering
    $('confirmWrap').hidden = !registering
    $('registerContacts').hidden = !registering
    $('emailWrap').hidden = !config.requireEmail
    $('emailCodeWrap').hidden = !config.requireEmail
    $('phoneWrap').hidden = !config.requirePhone
    $('phoneCodeWrap').hidden = !config.requirePhone
    $('forgot').hidden = registering || useCode
    $('switchMode').hidden = !config.registration && !registering
    $('password').autocomplete = registering ? 'new-password' : 'current-password'
    renderProviders()
    renderLegal()
  }

  async function bootstrap() {
    try {
      const result = await invoke('bootstrap')
      config = result.config
      state = result.state
      texts = result.texts || {}
      document.documentElement.lang = result.locale || 'zh-CN'
      if (state.error) error(describe(state.error))
      render()
    } catch (e) { error(describe(e)) }
  }

  $('settings').onclick = () => call('open_settings')
  $('passwordTab').onclick = () => { useCode = false; registering = false; error(''); render() }
  $('codeTab').onclick = () => { useCode = true; registering = false; error(''); render() }
  $('switchMode').onclick = () => { registering = !registering; useCode = false; error(''); render() }
  $('forgot').onclick = () => call('open_external', { url: state.server + '/vb/forgot-password' })
  $('retry').onclick = async () => { setBusy(true); error(''); try { await invoke('retry') } catch (e) { error(describe(e)) } finally { setBusy(false); await bootstrap() } }
  $('switchAccount').onclick = async () => { setBusy(true); try { await invoke('switch_account'); state = null; await bootstrap() } catch (e) { error(describe(e)) } finally { setBusy(false) } }

  async function sendCode(type, target, purpose, button) {
    if (!target) return error(t('login.required'))
    setBusy(true)
    button.disabled = true
    try {
      await invoke('send_code', { type, target, purpose })
      let remaining = 60
      cooling.add(button.id)
      const previous = button.textContent
      button.textContent = remaining + 's'
      const timer = setInterval(() => {
        remaining--
        button.textContent = remaining > 0 ? remaining + 's' : previous
        button.disabled = remaining > 0 || busy
        if (remaining <= 0) {
          cooling.delete(button.id)
          clearInterval(timer)
        }
      }, 1000)
    } catch (e) { error(describe(e)); button.disabled = false } finally { setBusy(false) }
  }

  $('sendCode').onclick = () => {
    const target = $('target').value.trim()
    return sendCode(target.includes('@') ? 'email' : 'sms', target, 'login', $('sendCode'))
  }
  $('sendEmailCode').onclick = () => sendCode('email', $('email').value.trim(), 'register', $('sendEmailCode'))
  $('sendPhoneCode').onclick = () => sendCode('sms', $('phone').value.trim(), 'register', $('sendPhoneCode'))

  $('form').onsubmit = async event => {
    event.preventDefault()
    if (busy) return
    if ($('consentWrap').hidden === false && !$('consent').checked) return error(t('login.consent'))
    setBusy(true); error('')
    try {
      if (registering) {
        if ($('password').value !== $('confirm').value) throw new Error(t('login.password_mismatch'))
        await invoke('register', {
          username: $('account').value.trim(), password: $('password').value,
          email: config.requireEmail ? $('email').value.trim() : '',
          phone: config.requirePhone ? $('phone').value.trim() : '',
          email_code: config.requireEmail ? $('emailCode').value.trim() : '',
          phone_code: config.requirePhone ? $('phoneCode').value.trim() : '',
        })
      } else if (useCode) {
        const target = $('target').value.trim()
        await invoke('login_code', { type: target.includes('@') ? 'email' : 'sms', target, code: $('code').value.trim() })
      } else {
        await invoke('login_password', { username: $('account').value.trim(), password: $('password').value })
      }
      $('password').value = ''
      $('confirm').value = ''
    } catch (e) {
      error(describe(e))
      await bootstrap()
    } finally { setBusy(false) }
  }
  window.aicNative.onSync(() => bootstrap())
  bootstrap()
})()
</script>
</body>
</html>
