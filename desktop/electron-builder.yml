# electron-builder 打包配置（须在目标平台构建，无法交叉）
appId: ai.ivec.desktop
productName: AIC Desktop
directories:
  output: ../dist
  buildResources: assets
files:
  - main.js
  - browser-path.cjs
  - backend-startup.cjs
  - loading.html
  - remote-preload.js
  - settings-preload.js
  - package.json
  - assets/**
  - "!**/*.test.mjs"
  # vendor/cua 走 extraResources（→ resources/cua），不进 asar（否则重复打包 + 丢可执行位/签名）
  - "!vendor/**"
  - scripts/**
  - "!scripts/test-*.mjs"
# Go 后端二进制（make desktop-backend 产出 desktop/bin/aic-backend）→ resources/backend/
# cua-driver 发行物（scripts/sync-cua.mjs 同步，固定版本 + sha256 校验）→ resources/cua/
# 运行时 main.js 注入 CUA_DRIVER_PATH / CUA_DRIVER_APP；vendor 未同步时该平台不带 cua
# （后端回落系统探测，用户自装 cua-driver 仍可用）
extraResources:
  - from: bin
    to: backend
    filter:
      - aic-backend*
  - from: vendor/cua
    to: cua
  - from: vendor
    to: .
    filter:
      - browser/**
artifactName: aic-desktop-${os}-${arch}.${ext}
mac:
  target: dmg
  icon: assets/icon.png
  category: public.app-category.productivity
  # 测试版不做 Developer ID 签名/公证：identity: null 跳过 electron-builder 自带签名，
  # 改由 afterPack 钩子对 .app 做 ad-hoc 深签（scripts/after-pack-adhoc-sign.js）——
  # 下载打开提示从「已损坏」（需 xattr 清隔离）变为「未验证开发者」（可在系统设置 →
  # 隐私与安全性 → 仍要打开）。直接 identity: "-" 会踩 electron-builder 26 的 ad-hoc
  # 相机/麦克风失效坑（electron-builder#9529），故用打包后深签。
  identity: null
  # 麦克风使用声明：缺失时 macOS 对 getUserMedia 静默返回无声轨（不报错、只出 -91dB 静音）
  extendInfo:
    NSMicrophoneUsageDescription: AIC Desktop 需要麦克风用于语音交互（桌宠/聊天语音输入）
win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: assets/icon.png
  category: Utility
  maintainer: veypi <i@veypi.com>
# 打包钩子：macOS ad-hoc 深签（见 mac 段注释；其他平台 no-op）
afterPack: scripts/after-pack-adhoc-sign.js
npmRebuild: false
