# electron-builder 打包配置（须在目标平台构建，无法交叉）
appId: ai.ivec.desktop
productName: ivec
directories:
  output: ../dist
  buildResources: assets
files:
  - main.js
  - runtime-paths.cjs
  - secure-origin.cjs
  - backend-startup.cjs
  - backend.cjs
  - host-state.cjs
  - platform-hosts.cjs
  - settings-protocol.cjs
  - loading.html
  - remote-preload.js
  - screenshot.cjs
  - settings-preload.js
  - settings-ui/**
  - package.json
  - assets/**
  - "!**/*.test.mjs"
  # vendor/cua 走 extraResources（→ resources/cua），不进 asar（否则重复打包 + 丢可执行位/签名）
  - "!vendor/**"
  - scripts/**
  - "!scripts/test-*.mjs"
# Go 后端二进制（make desktop-backend 产出 desktop/bin/aic-backend）→ resources/backend/
# cua-driver 发行物（scripts/sync-cua.mjs 同步，固定版本 + sha256 校验）→ resources/cua/
# 运行时 main.js 注入 AIC_CUA_BUNDLE_DIR；打包须先同步官方驱动。
# 官方 agent-browser 原生 CLI/MCP → resources/agent-browser；CuaDriver 自带 MCP。
extraResources:
  - from: bin
    to: backend
    filter:
      - aic-backend*
  - from: vendor/cua
    to: cua
  - from: vendor/browser/${platform}-${arch}
    to: browser/${platform}-${arch}
  - from: vendor/agent-browser/${platform}-${arch}
    to: agent-browser
  # 官方预装包设备程序（make skill-bin-desktop，预编译 browser/cua）→ resources/skill-bin/
  - from: vendor/skill-bin
    to: skill-bin
artifactName: aic-desktop-${os}-${arch}.${ext}
mac:
  target: dmg
  icon: assets/icon.png
  category: public.app-category.productivity
  # 签名与公证（方案见 docs/development/macos-signing.md）：
  # - identity 不写死：electron-builder 在钥匙串里找有效的 Developer ID Application
  #   身份；CI 准备步骤将 p12 与 G2 中间证书导入专用签名钥匙串。没有有效身份时
  #   electron-builder 会整体跳过签名（无自动 ad-hoc 回退），由 afterPack 钩子走 ad-hoc 深签兜底
  #   （本地开发路径，下载打开提示为「未验证开发者」）。
  # - hardenedRuntime 是公证前提；entitlements 是 Electron 跑起来的必要条件
  #   （allow-jit / allow-unsigned-executable-memory / disable-library-validation）。
  # - 公证由 afterSign 钩子执行：提交后立即输出 submission ID，每 30 秒轮询，
  #   默认 60 分钟超时；未提供 APPLE_API_KEY 时跳过（本地开发与手动 CI）。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: false
  # 麦克风使用声明：缺失时 macOS 对 getUserMedia 静默返回无声轨（不报错、只出 -91dB 静音）
  extendInfo:
    NSMicrophoneUsageDescription: ivec 需要麦克风用于语音交互（桌宠/聊天语音输入）
win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: assets/icon.png
  category: Utility
  maintainer: veypi <i@veypi.com>
# 打包钩子：同步/校验目标平台 Chrome；macOS 额外做签名准备（见 mac 段）
afterPack: scripts/after-pack-sign.js
afterSign: scripts/after-sign-notarize.js
beforePack: scripts/before-pack-browser.cjs
npmRebuild: false
