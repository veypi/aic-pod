<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent }
  body { cursor: col-resize; display: flex; justify-content: center }
  .line { width: 1px; height: 100%; background: #3a3f4a }
  body:hover .line { background: #4b83f6 }
</style>
</head>
<body>
  <div class="line"></div>
  <script>
    // 拖拽时主进程把本视图扩为全宽覆层接管鼠标（快速拖动不丢事件）；
    // 竖线跟随光标做即时反馈，抬起/划出窗口结束。
    const line = document.querySelector('.line')
    let down = false
    window.addEventListener('mousedown', () => {
      down = true
      line.style.transform = ''
      window.divider.down()
    })
    window.addEventListener('mousemove', (e) => {
      if (!down) return
      line.style.transform = `translateX(${e.clientX - window.innerWidth / 2}px)`
      window.divider.move(e.clientX)
    })
    const end = () => {
      if (!down) return
      down = false
      line.style.transform = ''
      window.divider.up()
    }
    window.addEventListener('mouseup', end)
    document.addEventListener('mouseleave', end)
  </script>
</body>
</html>
