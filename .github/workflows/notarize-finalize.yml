name: notarize-finalize

# 用途：build 工作流里 Apple 公证超过 4 小时仍未接受时，mac 构建会保留
# 「已签名 app zip + submission ID」artifact（signed-app-desktop-darwin-*）。
# 本工作流接着等 Apple（不再重新构建、不重新上传公证），接受后 staple 并用
# electron-builder --prepackaged 重打 DMG，最后把资产补进同一个 Release。
# Apple 侧 submission 永久保留：本工作流超时或被取消后，用同一 submission ID 重跑即可。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 产生 signed-app-* artifact 的 build run id
        required: true
        type: string
      target:
        description: 要补齐的 mac 构建
        required: true
        type: choice
        options:
          - desktop-darwin-arm64
          - desktop-darwin-amd64
      tag:
        description: 资产要补进的 Release tag，例如 v0.10.2
        required: true
        type: string
      submission_id:
        description: 留空则自动从 artifact 的 notary-pending-<arch>.json 读取
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: macos-15
    # GitHub 托管 job 上限 6 小时；轮询窗口 300 分钟，超时可用同一 ID 重跑。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install npm dependencies
        run: npm ci --prefix desktop
      - name: Prepare notarization key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          if [[ "$APPLE_API_KEY_B64" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$APPLE_API_KEY_B64" > "$RUNNER_TEMP/AuthKey.p8"
          else
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout -check
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Download signed app artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-app-${{ inputs.target }}
          path: dist/notary-pending
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for Apple, staple and rebuild DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          ARCH=x64
          if [ "$TARGET" = "desktop-darwin-arm64" ]; then ARCH=arm64; fi
          META="dist/notary-pending/notary-pending-$ARCH.json"
          if [ -z "$SUBMISSION_ID" ]; then
            SUBMISSION_ID=$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).submissionId")
          fi
          ZIP=$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).appZip")
          echo "submission ID: $SUBMISSION_ID"
          mkdir -p "$RUNNER_TEMP/finalize"
          ditto -x -k "dist/notary-pending/$ZIP" "$RUNNER_TEMP/finalize"
          APP=$(find "$RUNNER_TEMP/finalize" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          node desktop/scripts/notary-wait.js --id "$SUBMISSION_ID" --timeout-minutes 300
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t install "$APP"
          make desktop-version
          # prepackaged 只生成 DMG：跳过打包与签名，staple 票据不会被覆盖。
          (cd desktop && npx electron-builder --prepackaged "$APP" --mac --$ARCH)
          ls -l dist/aic-desktop-*
      - name: Upload DMG to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          for asset in dist/aic-desktop-*; do
            gh release upload "$TAG" "$asset" --clobber
          done
