name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    name: desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # arm64
            target: desktop-darwin-arm64
          - os: macos-14          # x64
            target: desktop-darwin-amd64
          - os: windows-latest
            target: desktop-windows-amd64
          - os: ubuntu-latest
            target: desktop-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install npm dependencies
        run: npm ci --prefix desktop
      - name: Test protocol, fs layer and desktop shell
        run: |
          go test ./protocol ./libs/fsx
          npm test --prefix desktop
      - name: Test exec engine (unix runners)
        if: runner.os != 'Windows'
        run: go test ./libs/execution
      - name: Test native files and authorization config
        run: go test ./libs/hostfs ./cfg
      - name: Prepare signing credentials (macOS)
        # 签名凭据自己装，不走 electron-builder 的 CSC_LINK 导入路径：后者建钥匙串用随机
        # 口令、却拿 p12 口令去 set-key-partition-list，那一步必然失败（且 CSC_* 跨平台，
        # 会把 mac 证书带去签 Windows exe）。
        # 2025 起 Developer ID 走 G2 签发链：经典 Apple Root CA 是信任锚，G2 中间证书
        # 必须作为普通证书导入实际签名钥匙串；只装进系统钥匙串时 codesign 仍可能报
        # “unable to build chain to self-signed root”。不要把中间证书标成信任根。
        # 注意：runner.os 的取值是 macOS / Linux / Windows，没有 Darwin。
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "未配置 CSC_LINK：跳过签名（产物走 ad-hoc 兜底）"
            exit 0
          fi
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain desktop/build/certs/AppleRootCA.cer
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          KC="$RUNNER_TEMP/aic-sign.keychain"
          KCPW="$(openssl rand -base64 32)"
          security create-keychain -p "$KCPW" "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security set-keychain-settings "$KC"
          LIST=$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g' | grep -v '^$')
          security list-keychains -d user -s "$KC" $LIST
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -P "$CSC_KEY_PASSWORD"
          security add-certificates -k "$KC" desktop/build/certs/DeveloperIDG2CA.cer
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application:/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "未找到有效 Developer ID Application 身份"
            exit 1
          fi
          # 完整打包前先签最小 Mach-O，避免证书链问题拖到数十分钟构建后才暴露。
          cp /bin/echo "$RUNNER_TEMP/aic-sign-smoke"
          codesign --force --sign "$IDENTITY" --keychain "$KC" \
            --options runtime --timestamp "$RUNNER_TEMP/aic-sign-smoke"
          codesign --verify --strict "$RUNNER_TEMP/aic-sign-smoke"
          echo "Developer ID 最小签名验证通过: $IDENTITY"
      - name: Prepare notarization key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "未配置 APPLE_API_KEY：跳过公证（产物为已签名未公证）"
            exit 0
          fi
          # Secret 可存原始 PEM 或 base64；落盘后立即验证，避免完整签名后才暴露密钥错误。
          if [[ "$APPLE_API_KEY_B64" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$APPLE_API_KEY_B64" > "$RUNNER_TEMP/AuthKey.p8"
          else
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout -check
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build (signed + notarized, macOS)
        # 签名凭据已在上面步骤装进搜索列表内的钥匙串；这里只给公证凭据
        # （APPLE_API_KEY 路径由上一步写入 GITHUB_ENV）。
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: make ${{ matrix.target }}
      - name: Build
        if: runner.os != 'macOS'
        run: make ${{ matrix.target }}
      - name: Verify signature (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d dist/mac*/AIC\ Desktop.app | head -1)
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          xcrun stapler validate "$APP" || echo "（无公证票据：未配置公证凭据时正常）"
          spctl -a -vvv -t install "$APP" || echo "（Gatekeeper 未认可：未公证时正常）"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/aic-desktop-*
          if-no-files-found: error
          retention-days: 7

  cli:
    name: cli (${{ matrix.targets }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: cli-linux-amd64 cli-linux-arm64
          - os: macos-15
            targets: cli-darwin-arm64 cli-darwin-amd64
          - os: windows-latest
            targets: cli-windows-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install go-winres (windows)
        if: runner.os == 'Windows'
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make ${{ matrix.targets }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.targets }}
          path: dist/aic-cli-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
