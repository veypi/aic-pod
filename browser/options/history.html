<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执行历史 — AIC Browser</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="options.css">
</head>
<body data-page="history">
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
    <h1>执行历史</h1>
    <p class="page-sub">最近 200 条工具请求</p>

    <div class="card">
      <div class="history-toolbar">
        <button type="button" id="history-refresh" class="btn-secondary">刷新</button>
        <button type="button" id="history-clear" class="btn-secondary">清空</button>
        <span id="history-count" class="status"></span>
      </div>
      <table class="history-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>工具</th>
            <th>动作</th>
            <th>会话</th>
            <th>状态</th>
            <th>错误</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr><td colspan="6" class="empty">暂无记录（连接后收到的请求会显示在这里）</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  </div>

  <script type="module" src="history.js"></script>
</body>
</html>
