<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地文件 — AIC Browser</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="options.css">
</head>
<body data-page="files">
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
    <h1>本地文件</h1>
    <p class="page-sub">查看和编辑浏览器本地文件</p>

    <div class="file-toolbar">
      <input type="text" id="file-search" class="file-search" placeholder="搜索文件名或路径…">
      <button type="button" id="file-refresh" class="btn-secondary">刷新</button>
    </div>

    <div class="file-layout">
      <div class="file-tree-pane card">
        <div id="file-tree" class="file-tree"></div>
      </div>
      <div class="file-view-pane card">
        <div class="pane-title" id="file-view-title">文件内容</div>
        <div class="pane-meta" id="file-meta"></div>
        <img id="file-image" class="file-image" alt="图片预览" hidden>
        <textarea id="file-content" class="file-content" spellcheck="false" placeholder="点击左侧文件查看/编辑内容"></textarea>
        <div class="file-actions">
          <button type="button" id="file-save" class="btn-primary">保存</button>
          <button type="button" id="file-newfile" class="btn-secondary">新建文件</button>
          <span id="file-status" class="status"></span>
        </div>
      </div>
    </div>
  </main>
  </div>

  <script type="module" src="files.js"></script>
</body>
</html>
