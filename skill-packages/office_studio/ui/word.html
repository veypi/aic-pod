<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Office Studio — 打开/审阅/保存 docx（docx-core 审阅工作台）；AI 与用户共用同一文档" />
  <title>Office Studio · Word</title>
</head>
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
  }

  /* ===== 编辑器视图 ===== */
  .ed {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-color-secondary);
  }

  .brand { font-weight: var(--font-weight-semibold); color: var(--color-primary); white-space: nowrap; }
  .path { font-size: var(--font-size-xs); opacity: .75; max-width: 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; }
  .st { font-size: var(--font-size-xs); opacity: .75; white-space: nowrap; }
  .err { font-size: var(--font-size-xs); color: var(--color-danger); white-space: nowrap; }
  .rev-label { display: inline-flex; align-items: center; gap: 4px; font-size: var(--font-size-xs); opacity: .75; white-space: nowrap; }

  button {
    padding: 4px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-color-tertiary);
    font-size: var(--font-size-sm);
    cursor: pointer;
    color: inherit;
    transition: border-color var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
  }

  button:hover { border-color: var(--border-color-hover); }
  button.primary { background: var(--color-primary); border-color: transparent; color: var(--color-primary-text); }
  button.primary:hover { background: var(--color-primary-hover); color: var(--color-primary-text); }
  button.ai { background: var(--color-secondary); border-color: transparent; color: var(--color-secondary-text); }
  button.ai:hover { background: var(--color-secondary-hover); color: var(--color-secondary-text); }

  .main { flex: 1; min-height: 0; display: flex; position: relative; }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--font-size-sm);
    color: var(--text-color-tertiary);
    pointer-events: none;
    z-index: 2;
  }

  /* ===== 文档渲染区 ===== */
  /* 注意：docx-preview 的 DOM 是运行时创建的 —— 选择器必须带 body 前缀穿透组件作用域 */
  .doc-wrap { flex: 1; min-width: 0; overflow: auto; background: var(--bg-color-tertiary); }
  body .doc-wrap .docx-wrapper { background: transparent; padding: 16px; }
  body .doc-wrap .docx-wrapper > section.docx { max-width: 100%; box-shadow: var(--shadow-md); }
  /* 修订样式：红=删除，绿=插入（docx-preview renderChanges 输出真实 ins/del 标签） */
  body .doc-wrap ins { color: color-mix(in srgb, var(--color-success) 80%, var(--text-color)); text-decoration: underline; background: color-mix(in srgb, var(--color-success) 16%, transparent); }
  body .doc-wrap del { color: color-mix(in srgb, var(--color-danger) 80%, var(--text-color)); text-decoration: line-through; background: color-mix(in srgb, var(--color-danger) 14%, transparent); }
  body .doc-wrap p[data-para-id]:hover { outline: 1px dashed color-mix(in srgb, var(--color-primary) 50%, transparent); }
  body .doc-wrap p.para-selected { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  /* 编辑定位短闪：AI/用户编辑后目标段落闪一下（引擎渲染后自动添加 .para-flash） */
  body .doc-wrap p.para-flash { animation: para-flash 1.6s ease-out; }
  @keyframes para-flash {
    0% { background: color-mix(in srgb, var(--color-primary) 30%, transparent); }
    100% { background: transparent; }
  }

  /* ===== 侧面板 ===== */
  .side {
    flex: none;
    width: 320px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border-color);
    background: var(--bg-color-secondary);
    min-height: 0;
  }

  .panel { padding: 8px 10px; border-bottom: 1px solid var(--border-color); }
  .panel h3 { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; opacity: .6; }

  /* ===== 审阅队列 ===== */
  .review-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .review-head h3 { margin: 0; }
  .review-stat { font-size: var(--font-size-xs); color: var(--text-color-tertiary); white-space: nowrap; }
  .batch-row { display: flex; gap: 6px; margin-top: 6px; }
  .batch-row button { padding: 3px 10px; font-size: var(--font-size-xs); }
  .review-list { flex: 1; overflow: auto; padding: 6px 8px; min-height: 0; }
  .rev-empty { text-align: center; color: var(--text-color-tertiary); padding: 24px 0; font-size: var(--font-size-xs); }
  .rev-item { padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; margin-bottom: 4px; }
  .rev-item:hover { background: color-mix(in srgb, var(--text-color) 6%, transparent); }
  .rev-item .row1 { display: flex; align-items: flex-start; gap: 6px; }
  .rev-tag { flex: none; font-size: var(--font-size-xs); line-height: 18px; padding: 0 6px; border-radius: var(--radius-full); }
  .rev-tag.t-del { background: color-mix(in srgb, var(--color-danger) 14%, transparent); color: var(--color-danger); }
  .rev-tag.t-ins { background: color-mix(in srgb, var(--color-success) 14%, transparent); color: var(--color-success); }
  .rev-tag.t-move, .rev-tag.t-cell { background: color-mix(in srgb, var(--color-warning) 16%, transparent); color: var(--color-warning); }
  .rev-tag.t-cmt { background: color-mix(in srgb, var(--color-info) 14%, transparent); color: var(--color-info); }
  .rev-text { flex: 1; min-width: 0; font-size: var(--font-size-xs); word-break: break-all; }
  .rev-item .row2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; padding-left: 2px; }
  .rev-sub { font-size: var(--font-size-xs); color: var(--text-color-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rev-ops { display: flex; gap: 4px; flex: none; }
  .rev-ops button { padding: 2px 10px; font-size: var(--font-size-xs); border-radius: var(--radius-md); }

  .sel-info {
    font-size: var(--font-size-xs);
    color: var(--color-info);
    background: color-mix(in srgb, var(--color-info) 14%, transparent);
    border-radius: var(--radius-md);
    padding: 4px 8px;
    margin-bottom: 6px;
    min-height: 24px;
    word-break: break-all;
  }

  input[type="text"] {
    width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-sm);
    margin-bottom: 5px;
    background: var(--bg-color);
    color: inherit;
  }

  .op-row { display: flex; gap: 6px; margin-bottom: 5px; }
  .op-row input { flex: 1; min-width: 0; margin-bottom: 0; }
  .op-row button { flex: none; }

  /* ===== 响应式（@container = 窗口宽度，不要用 @media） ===== */
  .panel-toggle { display: none; }

  /* 窄窗：侧栏收为浮层抽屉，顶栏出现「面板」开关 */
  @container (max-width: 960px) {
    .panel-toggle { display: inline-block; }
    .side {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(340px, 88cqw);
      display: none;
      z-index: 6;
      box-shadow: var(--shadow-lg);
    }
    .side.open { display: flex; }
  }

  @container (max-width: 720px) {
    .brand { display: none; }
    body .doc-wrap .docx-wrapper { padding: 8px; }
  }

  @container (max-width: 560px) {
    .path { display: none; }
  }
</style>

<body>
  <div class="ed">
    <div class="topbar">
      <button @click="goHome">首页</button>
      <button @click="onOpen">打开</button>
      <button @click="onSave">保存</button>
      <button @click="onInsertImage">插入图片</button>
      <button class="panel-toggle" @click="onTogglePanel">面板</button>
      <span class="brand">Office Studio · Word</span>
      <span class="path">{{ file_path || '未打开文件' }}</span>
      <span class="grow"></span>
      <label class="rev-label"><input type="checkbox" :checked="rev_render" @change="onToggleRev"> 显示修订</label>
      <span class="st">{{ status_text }}</span>
      <span v-if="boot_err" class="err">· {{ boot_err }}</span>
    </div>
    <div class="main">
      <div class="doc-wrap" :id="host_id"></div>
      <div class="empty-hint" v-if="!file_path">未打开文件 — 从「首页」选择文件，或点「打开」</div>
      <div class="side" :class="{ open: panel_open }">
        <div class="panel">
          <div class="review-head">
            <h3>审阅</h3>
            <span class="review-stat">{{ rev_stat }}</span>
          </div>
          <div class="batch-row">
            <button @click="onAcceptAI">接受 AI 修订</button>
            <button @click="onAcceptAll">接受全部</button>
            <button @click="onRejectAll">拒绝全部</button>
          </div>
        </div>
        <div class="review-list">
          <div class="rev-empty" v-if="!rev_items.length">没有待审的修订</div>
          <div class="rev-item" v-for="it in rev_items" @click="() => onItemLocate(it)">
            <div class="row1">
              <span class="rev-tag" :class="'t-' + it.type">{{ it.tag }}</span>
              <span class="rev-text">{{ it.display }}</span>
            </div>
            <div class="row2">
              <span class="rev-sub">{{ it.sub }}</span>
              <span class="rev-ops">
                <button v-if="it.kind === 'rev'" @click.stop="onRevAccept(it)">接受</button>
                <button v-if="it.kind === 'rev'" @click.stop="onRevReject(it)">拒绝</button>
                <button v-if="it.kind === 'cmt'" @click.stop="onCommentDelete(it)">{{ pending_delete_comment === it.id ? '确认删除？' : '删除' }}</button>
              </span>
            </div>
          </div>
        </div>
        <div class="panel">
          <h3>选区操作</h3>
          <div class="sel-info">{{ sel_text || '在文档中选择文字后操作' }}</div>
          <div class="op-row">
            <input type="text" v:value="op_replace" placeholder="替换为……（回车提交）" @keyup.enter="onHumanReplace" />
            <button class="primary" @click="onHumanReplace">替换</button>
          </div>
          <div class="op-row">
            <input type="text" v:value="op_comment" placeholder="批注内容……（回车提交）" @keyup.enter="onHumanComment" />
            <button @click="onHumanComment">批注</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<script setup>
  import { pushRecent } from './recent.js'

  // ===== 界面状态 =====
  ready = false
  boot_err = ''
  status_text = ''
  file_path = ''
  is_new = false         // 新建（未保存）模式：保存时写入目标路径
  rev_items = []         // 审阅队列条目（修订 + 批注）
  rev_stat = ''          // 统计行文案
  pending_delete_comment = -1 // 批注删除二次确认（待确认的批注 id；-1 = 无）
  sel_text = ''          // 当前选区描述
  op_replace = ''
  op_comment = ''
  rev_render = true
  panel_open = false     // 窄窗（≤960px）下侧栏抽屉是否展开
  active_para = ''       // 最近点击选中的段落 id（插入图片等的默认锚点）
  home_armed = false     // 「首页」未保存退出二次确认（再次点击才真正离开）

  // ===== 引擎引用（窗口级，避免响应式包装）=====
  modRef = null
  reviewRef = null       // createDocxReview 返回组合
  selRef = null          // 最近一次选区 {paragraphId, start, end, text}
  _route_off = null      // $router.onChange 取消函数（dispose 时调用）
  _last_route = ''       // 已处理的路由 fullPath（同页 query 变化去重）
  // 本页面实例的文档容器 id：平台是“单文档多窗口”，全局 getElementById('docx-host')
  // 会命中第一个窗口的容器——每实例生成唯一 id（模板 :id 绑定），确保只命中自己的容器
  host_id = 'docx-host-' + Math.random().toString(36).slice(2, 8)

  // 磁盘一致性 / 未保存追踪 / 诊断计数（非响应式内部状态）
  let _disk_hash = ''   // 打开或保存时的磁盘内容 sha-256（save 冲突检测基线）
  let _saved_seq = 0    // 最近一次保存时 doc 操作序号（doc._seq > _saved_seq 即有未保存修改）
  let _load_seq = 0     // 文档加载次数（诊断）
  let _save_seq = 0     // 保存次数（诊断）
  let _home_timer = 0   // 「首页」二次确认复位计时器

  const toTree = (p) => String(p || '').replace(/^\/fs(?=\/)/, '')
  const nameOf = (p) => String(p || '').split('/').filter(Boolean).pop() || 'document.docx'
  const reply = (o) => ({ content: JSON.stringify(o) })
  const errReply = (e) => ({ content: JSON.stringify({ ok: false, error: String((e && e.message) || e) }) })
  const argOf = (argv, key, def) => {
    const a = argv || []
    for (let i = 0; i < a.length; i++) if (a[i] === '--' + key) return a[i + 1]
    return def
  }
  const firstPos = (argv) => (argv || []).find((x) => !String(x).startsWith('--'))
  const sha256Hex = async (buf) => {
    const d = await crypto.subtle.digest('SHA-256', buf)
    return Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, '0')).join('')
  }
  // insert_table --data：JSON 二维数组（[["a","b"],["c","d"]]）或旧式 "a|b;c|d"（支持 \| \; \\ 转义）
  const parseTableData = (s) => {
    const raw = String(s)
    if (/^\s*\[/.test(raw)) {
      let j = null
      try { j = JSON.parse(raw) } catch (e) { throw new Error('--data JSON 解析失败：' + String((e && e.message) || e)) }
      if (!Array.isArray(j)) throw new Error('--data 需要二维数组')
      return j.map((row) => (Array.isArray(row) ? row.map((c) => (c == null ? '' : String(c))) : [String(row)]))
    }
    const splitEscaped = (str, delim) => {
      const out = []
      let cur = ''
      let esc = false
      for (const ch of String(str)) {
        if (esc) { cur += ch; esc = false; continue }
        if (ch === '\\') { esc = true; continue }
        if (ch === delim) { out.push(cur); cur = ''; continue }
        cur += ch
      }
      if (esc) cur += '\\'
      out.push(cur)
      return out
    }
    return raw.split(';').filter((x) => x.length).map((rowS) => splitEscaped(rowS, '|'))
  }

  // ===== 引擎资源：本地优先，CDN 回退（构建产物随仓库发布）=====
  // ENGINE_V：引擎与空白模板资源版本——更新 vendor 资源后递增以破浏览器缓存
  const CDN_VENDOR = 'https://cdn.jsdelivr.net/gh/veypi/aic-skills@main/office_studio/ui/vendor/'
  const ENGINE_V = '2026-09-13-6'
  const importLocal = (p) => import(new URL(((($mod.scoped || '').replace(/\/$/, '')) || '.') + '/' + p, location.origin).href)
  const loadEngineModule = async () => {
    try {
      return await importLocal('vendor/docx-review.bundle.js?v=' + ENGINE_V)
    } catch (e) {
      return await import(CDN_VENDOR + 'docx-review.bundle.js')
    }
  }

  // 空白文档模板（新建 Word 用；本地优先，CDN 回退）
  const loadBlankBytes = async () => {
    let r = null
    try { r = await fetch('vendor/blank.docx?v=' + ENGINE_V) } catch (e) { r = null }
    if (!r || !r.ok) {
      try { r = await fetch(CDN_VENDOR + 'blank.docx') } catch (e) { r = null }
    }
    if (!r || !r.ok) throw new Error('空白模板加载失败（blank.docx）')
    return await r.arrayBuffer()
  }

  // ===== 引擎引导（懒启动）=====
  const ensureEngine = async () => {
    if (reviewRef) return
    if (!modRef) {
      boot_err = ''
      try {
        modRef = await loadEngineModule()
      } catch (e) {
        boot_err = String((e && e.message) || e)
        status_text = '引擎加载失败'
        throw new Error('引擎加载失败：' + boot_err)
      }
    }
    await new Promise((r) => setTimeout(r, 40))
    reviewRef = modRef.createDocxReview({ container: document.getElementById(host_id), revisionRendering: rev_render })
    document.getElementById(host_id).addEventListener('mouseup', () => {
      setTimeout(() => { selRef = reviewRef.view.getSelection(); refreshSel() }, 0)
    })
    reviewRef.view.onPick((id) => { active_para = id })
    ready = true
    status_text = '就绪'
  }

  // ===== 视图刷新 =====
  const truncText = (s, n) => {
    const t = String(s || '')
    return t.length > n ? t.slice(0, n) + '…' : t
  }
  const refreshSel = () => {
    sel_text = selRef ? ('已选：「' + truncText(selRef.text, 30) + '」（' + selRef.start + '-' + selRef.end + '）') : ''
  }
  // 渲染调度（合并 + 不阻塞指令返回）：静默 400ms 后发起一次全量重渲染；
  // 批次最长 2000ms 强制渲染一次。指令 reply 不等渲染（渲染在后台队列执行，
  // 引擎侧另有串行+合并兜底），保证 AI 批量编辑时指令流水不被打断。
  let _refresh_timer = 0
  let _refresh_first = 0
  const refreshAll = () => {
    const now = Date.now()
    if (!_refresh_first) _refresh_first = now
    clearTimeout(_refresh_timer)
    const quiet = Math.max(60, Math.min(400, 2000 - (now - _refresh_first)))
    _refresh_timer = setTimeout(() => {
      _refresh_timer = 0
      _refresh_first = 0
      try {
        if (reviewRef) {
          reviewRef.refresh().then(() => {
            refreshSel()
            return refreshRevisions()
          }).catch(() => { /* 刷新失败不影响指令 */ })
        }
      } catch (e) { /* 忽略 */ }
    }, quiet)
    return Promise.resolve(true)
  }
  // 审阅队列：修订（引擎列表序）+ 批注（段落序），按段落号合并排序
  const TAG_LABEL = { del: '删除', ins: '插入', moveFrom: '移出', moveTo: '移入', cellIns: '表格', cellDel: '表格', cellMerge: '表格' }
  const TYPE_CLASS = { del: 'del', ins: 'ins', moveFrom: 'move', moveTo: 'move', cellIns: 'cell', cellDel: 'cell', cellMerge: 'cell' }
  const refreshRevisions = async () => {
    if (!reviewRef || !reviewRef.doc.loaded) { rev_items = []; rev_stat = ''; return }
    const paras = reviewRef.doc.readParagraphs({}).paragraphs
    const noOf = new Map(paras.map((p, i) => [p.id, i + 1]))
    const items = []
    for (const r of reviewRef.doc.listRevisions()) {
      if (r.commentMark) continue   // 批注锚点标记不单列（批注本体展示）
      items.push({
        kind: 'rev', id: r.id, type: TYPE_CLASS[r.type] || 'move', tag: TAG_LABEL[r.type] || r.type,
        display: r.text ? '「' + truncText(r.text, 60) + '」' : '（标记）',
        sub: (r.author || '?') + ' · 第 ' + (noOf.get(r.paraId) || '?') + ' 段',
        paraId: r.paraId,
      })
    }
    let cs = []
    try { cs = await reviewRef.doc.getComments() } catch (e) { cs = [] }
    for (const c of cs) {
      const pid = c.anchoredParagraphId || c.paragraphId || ''
      items.push({
        kind: 'cmt', id: c.id, type: 'cmt', tag: '批注',
        display: '「' + truncText(c.text, 60) + '」',
        sub: (c.author || '?') + ' · 第 ' + (noOf.get(pid) || '?') + ' 段',
        paraId: pid,
      })
    }
    items.sort((a, b) => {
      const d = (noOf.get(a.paraId) || 9999) - (noOf.get(b.paraId) || 9999)
      if (d) return d
      if (a.kind !== b.kind) return a.kind === 'rev' ? -1 : 1
      return String(a.id).localeCompare(String(b.id), undefined, { numeric: true })
    })
    rev_items = items
    const nRev = items.filter((x) => x.kind === 'rev').length
    const nCmt = items.length - nRev
    rev_stat = items.length ? ((nRev ? nRev + ' 处修订' : '') + (nRev && nCmt ? ' · ' : '') + (nCmt ? nCmt + ' 条批注' : '')) : '无待审内容'
  }

  // ===== 核心操作 =====
  // opts.newFile = 新建模式：加载空白模板（vendor/blank.docx），点「保存」时才写入目标路径
  const openPath = async (p, opts = {}) => {
    if (!p) throw new Error('需要文件路径')
    const asNew = !!(opts && opts.newFile)
    const forceReload = !!(opts && opts.reload)
    // 同一文件重复打开防护：有未保存修改时不静默重载（防丢编辑；open --reload 强制）
    if (!asNew && !forceReload && file_path === p && reviewRef && reviewRef.doc.loaded
      && reviewRef.doc._seq > _saved_seq) {
      status_text = '未重载：有未保存修改（可用 open --reload 强制重载）'
      throw new Error('该文件已打开且有未保存修改；如确认从磁盘重载请用 open --reload，或先 save')
    }
    try {
      status_text = '加载中…'
      await ensureEngine()
      if (asNew) {
        const ab = await loadBlankBytes()
        await reviewRef.loadBytes(ab)
        selRef = null
        file_path = p
        is_new = true
        _disk_hash = ''
        _saved_seq = reviewRef.doc._seq
        _load_seq += 1
        refreshSel()
        await refreshRevisions()
        status_text = '新建（未保存）：' + nameOf(p)
        return { ok: true, path: p, created: true }
      }
      const r = await $mod.$fs.get(toTree(p))
      if (r && r.ok === false) throw new Error(r.message || '读取失败')
      const content = r && r.content
      const blob = (content instanceof Blob) ? content : new Blob([content], { type: (r && r.mime) || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })
      const name = nameOf(p)
      const ab = await blob.arrayBuffer()
      const head = Array.from(new Uint8Array(ab.slice(0, 4))).map((b) => b.toString(16).padStart(2, '0')).join(' ')
      if (head !== '50 4b 03 04' && blob.size > 4 && head.slice(0, 5) !== '50 4b') {
        throw new Error('不是有效的 docx（zip 头缺失：' + head + '）')
      }
      const info = await reviewRef.loadBytes(ab)
      selRef = null
      file_path = p
      is_new = false
      _disk_hash = await sha256Hex(ab)
      _saved_seq = reviewRef.doc._seq
      _load_seq += 1
      pushRecent(p, name)
      refreshSel()
      await refreshRevisions()
      status_text = '已打开 ' + name + '（' + blob.size + ' B · ' + info.bookmarks.paragraphCount + ' 段落）'
      return { ok: true, path: p, size: blob.size, paragraphs: info.bookmarks.paragraphCount }
    } catch (e) {
      const msg = String((e && e.message) || e)
      status_text = '打开失败：' + msg
      throw e
    }
  }

  const saveNow = async (opts = {}) => {
    if (!reviewRef || !reviewRef.doc.loaded) throw new Error('未打开文件（可先 open <fs 路径>）')
    if (!file_path) throw new Error('无保存路径')
    // 保存前冲突检测：磁盘内容与打开/上次保存时不一致 → 拒绝覆盖（save --force 可跳过）
    if (!is_new && !opts.force) {
      let conflict = false
      try {
        const r2 = await $mod.$fs.get(toTree(file_path))
        if (r2 && r2.ok !== false) {
          const c2 = r2 && r2.content
          const b2 = (c2 instanceof Blob) ? c2 : new Blob([c2])
          const h2 = await sha256Hex(await b2.arrayBuffer())
          conflict = !!_disk_hash && h2 !== _disk_hash
        }
      } catch (e) { conflict = false }
      if (conflict) {
        throw new Error('文件已被外部修改（磁盘与打开时不一致）。如确认覆盖请用 save --force，或重新打开该文件')
      }
    }
    const bytes = await reviewRef.exportBytes()
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })
    await $mod.$fs.put(toTree(file_path), blob)
    _disk_hash = await sha256Hex(bytes)
    _saved_seq = reviewRef.doc._seq
    _save_seq += 1
    const created = is_new
    is_new = false
    pushRecent(file_path, nameOf(file_path))
    status_text = '已保存 ' + nameOf(file_path) + '（' + blob.size + ' B）'
    return { ok: true, path: file_path, size: blob.size, created }
  }

      _home_timer = setTimeout(() => { home_armed = false; if (String(status_text).indexOf('未保存修改') >= 0) status_text = '就绪' }, 4000)

      { name: 'insert_image', desc: '在段落前/后插入图片（png/jpg/gif/bmp；默认 AI 红字修订）',
        help: 'insert_image --src <fs路径> [--anchor <段落id>|@end] [--pos after|before] [--from <段落id> 格式源，默认取锚点] [--width px] [--height px] [--alt "说明"] [--plain] [--author AI]',
        handler: async (argv) => { try { if (!reviewRef || !reviewRef.doc.loaded) throw new Error('未打开文件'); const src = argOf(argv, 'src') || firstPos(argv); if (!src) throw new Error('需要 --src <fs 路径>'); const r0 = await $mod.$fs.get(toTree(src)); if (r0 && r0.ok === false) throw new Error(r0.message || '读取图片失败'); const content = r0 && r0.content; const blob = (content instanceof Blob) ? content : new Blob([content]); const bytes = new Uint8Array(await blob.arrayBuffer()); const anchor = argOf(argv, 'anchor', '@end'); const pos = (argOf(argv, 'pos', 'after') || 'after').toUpperCase(); const w = argOf(argv, 'width'); const h = argOf(argv, 'height'); const plain = argv && argv.includes('--plain'); const r = await reviewRef.doc.run('ai', 'insert_image', { bytes, ext: '', paragraphId: anchor, position: pos, styleSourceId: argOf(argv, 'from') || undefined, widthPx: w != null ? Number(w) : undefined, heightPx: h != null ? Number(h) : undefined, altText: argOf(argv, 'alt'), author: plain ? undefined : argOf(argv, 'author', 'AI') }); await refreshAll(); if (!r.ok) throw new Error(r.error); return reply({ ok: true, ...r.result, src }) } catch (e) { return errReply(e) } } },
      { name: 'delete_paragraph', desc: '删除段落（默认 AI 红字修订：接受=删段，拒绝=恢复）',
        help: 'delete_paragraph --para <id> [--plain 直接删除] [--author AI]',
        handler: async (argv) => { try { if (!reviewRef || !reviewRef.doc.loaded) throw new Error('未打开文件'); const para = argOf(argv, 'para'); if (!para) throw new Error('需要 --para'); const plain = !!(argv && argv.includes('--plain')); const r = await reviewRef.doc.run('ai', 'delete_paragraph', { paragraphId: para, author: plain ? undefined : argOf(argv, 'author', 'AI'), plain }); await refreshAll(); if (!r.ok) throw new Error(r.error); return reply({ ok: true, ...r.result }) } catch (e) { return errReply(e) } } },
      { name: 'move_paragraph', desc: '移动段落（默认修订式：目标处插入+原处删除；接受=移动生效，拒绝=原位保留）',
        help: 'move_paragraph --para <id> --anchor <id|@start|@end> [--pos after|before] [--plain] [--author AI]',
        handler: async (argv) => { try { if (!reviewRef || !reviewRef.doc.loaded) throw new Error('未打开文件'); const para = argOf(argv, 'para'); const anchorNode = argOf(argv, 'anchor'); if (!para || !anchorNode) throw new Error('需要 --para 与 --anchor'); const pos = (argOf(argv, 'pos', 'after') || 'after').toUpperCase(); const plain = !!(argv && argv.includes('--plain')); const r = await reviewRef.doc.run('ai', 'move_paragraph', { paragraphId: para, anchorNodeId: anchorNode, relativePosition: pos, author: plain ? undefined : argOf(argv, 'author', 'AI'), plain }); await refreshAll(); if (!r.ok) throw new Error(r.error); return reply({ ok: true, ...r.result }) } catch (e) { return errReply(e) } } },
      { name: 'style_report', desc: '样式与标题结构报告（只读）：段落样式统计 + 标题大纲（含解析后的自动编号）',
        help: 'style_report（无参数）；返回 {total, styles, headings:[{id,text,level,source,style_name,number,num_id,ilvl}], numbering_groups}',
        handler: async () => { try { if (!reviewRef || !reviewRef.doc.loaded) throw new Error('未打开文件'); return reply({ ok: true, ...reviewRef.doc.styleReport() }) } catch (e) { return errReply(e) } } },
      { name: 'accept_ai', desc: '接受 AI 的修订（其余作者修订保留）',
        help: 'accept_ai [--author AI]',
        handler: async (argv) => { try { const author = argOf(argv, 'author', 'AI'); const r = await reviewRef.doc.acceptAIEdits({ author }); await refreshAll(); return reply({ ok: true, selected: r.selectedIds, ...r.result }) } catch (e) { return errReply(e) } } },
      { name: 'reject_ai', desc: '拒绝 AI 的修订（恢复 AI 改动前状态，其余修订保留）',
        help: 'reject_ai [--author AI]',
        handler: async (argv) => { try { const author = argOf(argv, 'author', 'AI'); const r = await reviewRef.doc.rejectAIEdits({ author }); await refreshAll(); return reply({ ok: true, selected: r.selectedIds, ...r.result }) } catch (e) { return errReply(e) } } },
      { name: 'accept_all', desc: '接受全部修订', handler: async () => { try { const r = await reviewRef.doc.acceptAll(); await refreshAll(); return reply({ ok: true, ...r }) } catch (e) { return errReply(e) } } },
      { name: 'reject_all', desc: '拒绝全部修订', handler: async () => { try { const r = await reviewRef.doc.rejectAll(); await refreshAll(); return reply({ ok: true, ...r }) } catch (e) { return errReply(e) } } },
      { name: 'save', desc: '把当前文档写回打开时的 /fs 路径（docx）；磁盘被外部修改时拒绝覆盖（--force 强制）',
        help: '无参数；可选 --path <fs 路径> 另存；--force 跳过外部修改检测',
        handler: async (argv) => { try { const p = argOf(argv, 'path'); if (p) file_path = p; const force = !!(argv && argv.includes('--force')); return reply(await saveNow({ force })) } catch (e) { return errReply(e) } } },
    ],
  }

  // ===== 路由参数（单值 query.path；new=1 = 新建模式）=====
  const looksLikeFsPath = (p) => /^\/(fs\/)?(cloud|page)\//.test(p) || /^\/(fs\/)?[a-f0-9]{32}\//.test(p)
  const routeTask = () => {
    const p = String(($router.query && $router.query.path) || '')
    if (!p || !looksLikeFsPath(p)) return null
    return { path: p, newFile: String(($router.query && $router.query.new) || '') === '1' }
  }
  const applyRoute = () => {
    const fp = String(($router.current && $router.current.fullPath) || '')
    if (fp && fp === _last_route) return
    const t = routeTask()
    if (!t) return
    _last_route = fp
    openPath(t.path, { newFile: t.newFile }).catch(() => { /* openPath 已置状态 */ })
  }
  applyRoute()
  _route_off = $router.onChange(applyRoute)
</script>

<script dispose>
  // 页面销毁：取消路由订阅（页面缓存复用时不触发）
  try { if (_route_off) _route_off() } catch (e) { /* 忽略 */ }
</script>

</html>
