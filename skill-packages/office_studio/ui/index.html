<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Office Studio — 统一首页：打开/新建 xlsx、docx，共享最近打开历史，点击进入对应编辑器" />
  <title>Office Studio</title>
</head>
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
  }

  .home {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-lg);
    overflow: auto;
  }

  .home-card { width: min(620px, 100%); }
  .home-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .home-head .hb { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-primary); }
  .home-head .sub { font-size: var(--font-size-xs); opacity: .7; }
  .home-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

  button {
    padding: 4px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-color-tertiary);
    font-size: var(--font-size-sm);
    cursor: pointer;
    color: inherit;
    transition: border-color var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
  }

  button:hover { border-color: var(--border-color-hover); }

  button.primary {
    padding: 8px 20px;
    font-size: var(--font-size-md);
    background: var(--color-primary);
    border-color: transparent;
    color: var(--color-primary-text);
  }

  button.primary:hover { background: var(--color-primary-hover); color: var(--color-primary-text); }

  .recent-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .recent-title { font-size: var(--font-size-xs); opacity: .65; }
  .clear-btn { padding: 2px 10px; font-size: var(--font-size-xs); border-radius: var(--radius-md); }
  .clear-btn.confirm { color: var(--color-danger); border-color: var(--color-danger); }

  .recent-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color var(--transition-fast), background var(--transition-fast);
  }

  .recent-row:hover { border-color: var(--border-color-hover); background: color-mix(in srgb, var(--text-color) 6%, transparent); }
  .recent-row > i { flex: none; opacity: .9; }
  .recent-row > i.k-excel { color: color-mix(in srgb, #1d6f42 78%, var(--text-color)); }
  .recent-row > i.k-word { color: color-mix(in srgb, #2b579a 78%, var(--text-color)); }
  .recent-row .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .recent-row .name { font-weight: var(--font-weight-medium); }
  .recent-row .rpath { font-size: var(--font-size-xs); opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .del-btn { flex: none; padding: 2px 8px; font-size: var(--font-size-xs); border-radius: var(--radius-md); opacity: .55; }
  .del-btn:hover { opacity: 1; color: var(--color-danger); border-color: var(--color-danger); }

  .empty { font-size: var(--font-size-xs); opacity: .6; }
  .home-err { margin-top: 12px; font-size: var(--font-size-xs); color: var(--color-danger); word-break: break-all; }

  /* ===== 响应式（@container = 窗口宽度，不要用 @media） ===== */
  @container (max-width: 640px) {
    .home { padding: var(--spacing-md); }
  }
</style>

<body>
  <div class="home">
    <div class="home-card">
      <div class="home-head">
        <span class="hb">Office Studio</span>
        <span class="sub">打开或新建 office 文件（xlsx / docx），点击后进入编辑器</span>
      </div>
      <div class="home-actions">
        <button class="primary" @click="onOpen">打开文件</button>
        <button @click="onNew('excel')">新建表格</button>
        <button @click="onNew('word')">新建文档</button>
      </div>
      <div v-if="recent.length">
        <div class="recent-head">
          <span class="recent-title">最近打开</span>
          <button class="clear-btn" :class="{ confirm: pending_clear }" @click="onClear">{{ pending_clear ? '确认清空？' : '清空' }}</button>
        </div>
        <div class="recent-row" v-for="r in recent" @click="go(r.path)">
          <i class="fa-solid" :class="r.kind === 'word' ? 'fa-file-word k-word' : 'fa-file-excel k-excel'"></i>
          <div class="meta">
            <span class="name">{{ r.name }}</span>
            <span class="rpath">{{ r.path }}</span>
          </div>
          <button class="del-btn" @click.stop="onRemove(r.path)">移除</button>
        </div>
      </div>
      <div v-if="!recent.length" class="empty">还没有打开过文件</div>
      <div v-if="home_err" class="home-err">{{ home_err }}</div>
    </div>
  </div>
</body>

<script setup>
  import { loadRecent, removeRecent, clearRecent, kindOf } from './recent.js'

  // ===== 界面状态 =====
  recent = loadRecent()
  home_err = ''
  pending_clear = false

  const errMsg = (e) => String((e && e.message) || e)

  // 打开/跳转：按类型进入对应编辑器子页面（同窗导航；裸赋值注册 $data，模板事件才能解析）
  go = (p) => {
    const page = kindOf(p) === 'word' ? 'word' : 'excel'
    $router.push(page + '?path=' + encodeURIComponent(p))
  }

  // 另存为对话框的初始目录：最近打开文件所在目录（无历史则根）
  const startDir = () => {
    const first = (recent[0] && recent[0].path) || ''
    if (!first) return ''
    const seg = String(first).split('/').filter(Boolean)
    seg.pop()
    return seg.length ? '/' + seg.join('/') : ''
  }

  // ===== 用户界面事件 =====
  onOpen = async () => {
    try {
      home_err = ''
      const f = await $mod.$fs.open({ accept: ['.xlsx', '.xls', '.docx', '.doc'] })
      if (!f) return
      go(f.path)
    } catch (e) { home_err = '打开失败：' + errMsg(e) }
  }

  // 新建：先弹出另存为对话框选路径（只返回路径、不落盘，点「保存」时才写入）
  onNew = async (kind) => {
    try {
      home_err = ''
      const isWord = kind === 'word'
      const f = await $mod.$fs.save_as({
        name: isWord ? '未命名.docx' : '未命名.xlsx',
        ext: isWord ? '.docx' : '.xlsx',
        accept: [isWord ? '.docx' : '.xlsx'],
        start: startDir(),
      })
      if (!f) return
      const page = isWord ? 'word' : 'excel'
      $router.push(page + '?path=' + encodeURIComponent(f.path) + '&new=1')
    } catch (e) { home_err = '新建失败：' + errMsg(e) }
  }

  onRemove = (p) => {
    removeRecent(p)
    recent = loadRecent()
  }

  onClear = () => {
    if (!pending_clear) { pending_clear = true; return }
    clearRecent()
    recent = []
    pending_clear = false
  }

  // ===== 平台操控面 =====
  pageDesc = {
    desc: 'Office Studio 首页：统一打开/新建 xlsx、docx，展示共享最近打开历史',
    commands: [
      { name: 'status', desc: '首页状态（最近打开列表）',
        handler: async () => ({ content: JSON.stringify({ ok: true, recent: loadRecent().map((r) => ({ path: r.path, name: r.name, kind: r.kind })) }) }) },
    ],
  }
</script>

</html>
