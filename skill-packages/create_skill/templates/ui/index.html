<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <meta name="description" content="my_tool"
    details="Minimal skill ui page template: vhtml script setup + $fetch calling package api (api/list, api/add). Replace contents with your own.">
  <title>my_tool</title>
</head>
<style>
  body {
    width: 100%;
    padding: 16px;
    font-family: var(--font-family, system-ui, sans-serif);
    background: var(--bg-color, #fff);
    color: var(--text-color, #222);
  }

  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border-color, #eee);
  }
</style>

<body>
  <h3>my_tool</h3>
  <div class="row">
    <input v-model="title" placeholder="title" />
    <input v-model.number="qty" type="number" placeholder="qty" style="width:80px" />
    <button @click="add">add</button>
    <button @click="load">refresh</button>
  </div>
  <div v-if="error" style="color:var(--color-danger,#e33)">{{error}}</div>
  <div v-for="it in items" class="item">{{it.title}} × {{it.qty}}</div>
  <div v-if="!items.length" style="color:var(--text-color-secondary,#999)">暂无数据</div>
</body>
<script setup>
  // 包页面由平台固定 env.js 完成引导：$fetch（模块本地）、$t、$message 等直接可用。
  // 包内 api 用相对地址（api/{name}）——相对包服务前缀解析，与部署 id 无关。
  items = []
  title = ''
  qty = 1
  error = ''

  load = async () => {
    error = ''
    try {
      const r = await $fetch('api/list')
      items = r.rows || []
    } catch (e) { error = e.message }
  }
  add = async () => {
    error = ''
    try {
      await $fetch('api/add', { method: 'POST', body: { title: title, qty: qty || 1 } })
      title = ''
      await load()
    } catch (e) { error = e.message }
  }
  mount = () => load()
</script>
<script>mount()</script>

</html>
