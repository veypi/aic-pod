<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="CUA Status & Permission Diagnostics"
    details="CUA (Computer Use) diagnostics: device selector, cua status (driver state/path), macOS accessibility & screen-recording authorization guide. v1 has no observe/operate panel.">
  <title>{{$t('cua.title')}}</title>
</head>
<style>
  body {
    width: 100%;
    padding: var(--spacing-lg);
    background: var(--bg-color);
    color: var(--text-color);
  }

  .cua-page {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
  }

  .cua-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    flex-wrap: wrap;
  }

  .cua-head h2 {
    margin: 0;
    font-size: var(--font-size-xl);
  }

  .cua-card {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-color-secondary);
    padding: var(--spacing-lg);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }

  .cua-row {
    display: flex;
    gap: var(--spacing-sm);
    align-items: baseline;
    font-size: var(--font-size-sm);
  }

  .cua-row .k {
    color: var(--text-color-secondary);
    min-width: 96px;
    flex-shrink: 0;
  }

  .cua-row .v {
    word-break: break-all;
    font-family: var(--font-mono);
  }

  .state-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: var(--font-size-xs);
    font-weight: 600;
    border: 1px solid var(--border-color);
  }

  .state-pill.ready { color: var(--color-success, #22c55e); border-color: var(--color-success, #22c55e); }
  .state-pill.stopped { color: var(--text-color-secondary); }
  .state-pill.unavailable, .state-pill.error { color: var(--color-danger, #ef4444); border-color: var(--color-danger, #ef4444); }

  .guide li {
    margin: 6px 0;
    line-height: 1.6;
    font-size: var(--font-size-sm);
  }

  .guide code {
    font-family: var(--font-mono);
    background: var(--bg-color-hover, rgba(0, 0, 0, 0.06));
    padding: 1px 6px;
    border-radius: var(--radius-sm);
  }
</style>

<body>
  <div class="cua-page">
    <div class="cua-head">
      <h2>{{$t('cua.title')}}</h2>
      <div style="display:flex; gap:8px; align-items:center">
        <select v-model="selectedHostId" @change="refresh" :aria-label="$t('cua.device')">
          <option value="" disabled>{{$t('cua.device')}}</option>
          <option v-for="d in devices" :value="d.id">{{d.name}}</option>
        </select>
        <button class="btn-ghost" @click="refresh" :disabled="loading" :title="$t('cua.refresh')">
          <i class="fa-solid fa-arrows-rotate" :class="{'fa-spin': loading}"></i>
        </button>
      </div>
    </div>

    <div class="cua-card" v-if="status">
      <div class="cua-row">
        <span class="k">{{$t('cua.state')}}</span>
        <span class="state-pill" :class="status.state">{{status.state}}</span>
      </div>
      <div class="cua-row" v-if="status.driver">
        <span class="k">{{$t('cua.driver')}}</span>
        <span class="v">{{status.driver}}</span>
      </div>
      <div class="cua-row" v-if="error">
        <span class="k">{{$t('cua.error')}}</span>
        <span class="v">{{error}}</span>
      </div>
    </div>

    <div class="cua-card guide">
      <strong>{{$t('cua.guide_title')}}</strong>
      <ol style="margin:0; padding-left: 20px">
        <li>{{$t('cua.guide_step1')}}</li>
        <li>{{$t('cua.guide_step2')}}</li>
        <li v-html="$t('cua.guide_step3')"></li>
        <li v-html="$t('cua.guide_step4')"></li>
      </ol>
    </div>
  </div>
</body>
<script setup>
  devices = []
  selectedHostId = ''
  status = null
  error = ''
  loading = false
  let connection = null
  let disposed = false

  cuaCall = async (script) => {
    const r = await connection.execCall(script, {waitMS: 15000})
    if (r?.attrs?.exit_code !== '0')
      throw new Error(r?.attrs?.stderr || r?.content || 'cua command failed')
    return JSON.parse(r?.content || 'null')
  }

  refresh = async () => {
    if (!selectedHostId || loading) return
    loading = true
    error = ''
    try {
      if (!connection || connection.closed)
        connection = await $hosts.openTools(selectedHostId)
      status = await cuaCall('cua status --json')
    } catch (e) {
      error = e.message
      status = {state: 'error'}
      await connection?.close().catch(() => {})
      connection = null
    }
    loading = false
  }

  mount = async () => {
    const hosts = (await $hosts.directory.list()).filter(h => h.status === 'enabled')
    devices = hosts.map(h => ({id: h.id, name: h.name || h.hostname || h.id}))
    if (disposed) return
    // 路由带 host（/skills/{host_id}/cua）时预选该设备。
    const rid = String($router?.current?.params?.host_id || '')
    selectedHostId = (rid && hosts.find(h => h.id === rid)) ? rid : (devices[0]?.id || '')
    if (selectedHostId) refresh()
  }
  unmount = () => {
    disposed = true
    connection?.close().catch(() => {})
    connection = null
  }
</script>
<script>mount()</script>
<script dispose>unmount()</script>

</html>
