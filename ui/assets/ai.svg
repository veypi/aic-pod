<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent 头像">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 整体：上下浮动 + 微歪头 ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -7;0 -3;0 0" keyTimes="0;.3;.6;1" dur="5s"
      repeatCount="indefinite" calcMode="spline"
      keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 256 280;-1.5 256 280;1.5 256 280;0 256 280" keyTimes="0;.3;.6;1" dur="5s"
        repeatCount="indefinite" calcMode="spline"
        keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>

      <!-- ===== 头顶灯泡天线 ===== -->
      <rect x="246" y="98" width="20" height="26" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="10"/>
      <circle cx="256" cy="72" r="34" fill="url(#glowGrad)">
        <animate attributeName="opacity" values=".25;.8;.25" keyTimes="0;.5;1"
          dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
      </circle>
      <circle cx="256" cy="72" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="10"/>
      <circle cx="249" cy="65" r="5" fill="#1a1a1a" opacity=".25"/>
      <!-- 光芒 -->
      <g stroke="#1a1a1a" stroke-width="8" stroke-linecap="round">
        <line x1="210" y1="46" x2="198" y2="34">
          <animate attributeName="opacity" values=".3;1;.3" keyTimes="0;.5;1" dur="2.4s"
            begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        </line>
        <line x1="256" y1="34" x2="256" y2="20">
          <animate attributeName="opacity" values=".3;1;.3" keyTimes="0;.5;1" dur="2.4s"
            begin=".4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        </line>
        <line x1="302" y1="46" x2="314" y2="34">
          <animate attributeName="opacity" values=".3;1;.3" keyTimes="0;.5;1" dur="2.4s"
            begin=".8s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        </line>
      </g>

      <!-- ===== 耳罩 ===== -->
      <rect x="66"  y="238" width="42" height="96" rx="21" fill="#ffffff" stroke="#1a1a1a" stroke-width="12"/>
      <rect x="404" y="238" width="42" height="96" rx="21" fill="#ffffff" stroke="#1a1a1a" stroke-width="12"/>
      <line x1="87"  y1="262" x2="87"  y2="310" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" opacity=".35"/>
      <line x1="425" y1="262" x2="425" y2="310" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" opacity=".35"/>

      <!-- ===== 头盔 ===== -->
      <circle cx="256" cy="290" r="172" fill="#ffffff" stroke="#1a1a1a" stroke-width="14"/>
      <path d="M148 210 Q190 150 262 138" fill="none" stroke="#1a1a1a" stroke-width="10"
            stroke-linecap="round" opacity=".12"/>

      <!-- ===== 透明面屏（仅描边勾勒轮廓） ===== -->
      <rect x="104" y="188" width="304" height="208" rx="102" fill="none" stroke="#1a1a1a" stroke-width="14"/>

      <!-- ===== 睁眼状态：眨眼后闭眼，顺势切换开心 ===== -->
      <g transform="translate(256 268)">
        <g>
          <animateTransform attributeName="transform" type="scale"
            values="1 1;1 1;1 .08;1 1;1 1;1 .08;1 .08;1 1;1 1"
            keyTimes="0;.16;.185;.21;.42;.45;.54;.92;1" dur="6s"
            repeatCount="indefinite" calcMode="spline"
            keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
          <animate attributeName="opacity" values="1;1;0;0;1;1"
            keyTimes="0;.5;.54;.88;.92;1" dur="6s" repeatCount="indefinite"/>
          <g transform="translate(-256 -268)">
            <circle cx="196" cy="268" r="33" fill="#1a1a1a"/>
            <circle cx="202" cy="274" r="13" fill="#ffffff"/>
            <circle cx="187" cy="257" r="8"  fill="#ffffff"/>
            <circle cx="316" cy="268" r="33" fill="#1a1a1a"/>
            <circle cx="322" cy="274" r="13" fill="#ffffff"/>
            <circle cx="307" cy="257" r="8"  fill="#ffffff"/>
          </g>
        </g>
      </g>

      <!-- 睁眼微笑 -->
      <path d="M226 326 Q256 348 286 326" fill="none" stroke="#1a1a1a"
            stroke-width="12" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0;0;1;1"
          keyTimes="0;.48;.54;.88;.92;1" dur="6s" repeatCount="indefinite"/>
      </path>

      <!-- ===== 开心状态：弯眼弹入 ===== -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0"
          keyTimes="0;.52;.58;.86;.91;1" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 10;0 10;0 0;0 0;0 6;0 10" keyTimes="0;.52;.58;.86;.91;1" dur="6s"
          repeatCount="indefinite" calcMode="spline"
          keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
        <g transform="translate(256 262)">
          <g>
            <animateTransform attributeName="transform" type="scale"
              values=".7 .7;.7 .7;1.08 1.08;1 1;1 1;.8 .8;.7 .7"
              keyTimes="0;.52;.58;.62;.86;.91;1" dur="6s"
              repeatCount="indefinite" calcMode="spline"
              keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
            <g transform="translate(-256 -262)" stroke="#1a1a1a" stroke-width="16"
               stroke-linecap="round" fill="none">
              <path d="M162 276 Q196 236 230 276"/>
              <path d="M282 276 Q316 236 350 276"/>
            </g>
          </g>
        </g>
      </g>

      <!-- 腮红 -->
      <g stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;.6;.6;0;0"
          keyTimes="0;.56;.66;.82;.9;1" dur="6s" repeatCount="indefinite"/>
        <line x1="146" y1="312" x2="158" y2="306"/>
        <line x1="148" y1="324" x2="160" y2="318"/>
        <line x1="354" y1="306" x2="366" y2="312"/>
        <line x1="352" y1="318" x2="364" y2="324"/>
      </g>

      <!-- 大笑 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0"
          keyTimes="0;.52;.58;.86;.91;1" dur="6s" repeatCount="indefinite"/>
        <g transform="translate(256 330)">
          <g>
            <animateTransform attributeName="transform" type="scale"
              values=".8 .8;.8 .8;1.1 1.1;1 1;1 1;.8 .8;.8 .8"
              keyTimes="0;.52;.58;.62;.86;.91;1" dur="6s"
              repeatCount="indefinite" calcMode="spline"
              keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"/>
            <path transform="translate(-256 -330)" d="M212 316 Q256 362 300 316"
                  fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
