<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>AIC 本地设置</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      background: var(--bg-color-secondary, #1e2128);
    }

    .card {
      width: min(520px, 100%);
      box-sizing: border-box;
      margin: auto;
      padding: 28px 32px
    }

    h1 {
      font-size: 17px;
      margin: 0 0 4px
    }

    .sub {
      color: var(--text-color-tertiary, #8b919c);
      font-size: 12px;
      margin-bottom: 18px
    }

    label {
      display: block;
      margin: 12px 0 4px;
      color: var(--text-color-secondary, #aab0ba);
      font-size: 13px
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 8px;
      background: var(--bg-color, #16181d);
      color: var(--text-color, #e8eaed);
      font-size: 13px
    }

    input:focus {
      outline: none;
      border-color: #4b83f6
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row input {
      flex: 1
    }

    select {
      padding: 5px 8px;
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 8px;
      background: var(--bg-color, #16181d);
      color: var(--text-color, #e8eaed);
      font-size: 12px
    }

    .auth-title {
      margin: 22px 0 2px;
      font-size: 14px;
      color: var(--text-color, #e8eaed)
    }

    .auth-hint {
      color: var(--text-color-tertiary, #8b919c);
      font-size: 12px
    }

    .domain {
      border: 1px solid var(--border-color, #3a3f4a);
      border-radius: 10px;
      padding: 10px 12px 12px;
      margin-top: 12px
    }

    .dhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .dname {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color, #e8eaed)
    }

    .alist label {
      margin-top: 8px
    }

    .alist input {
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    .entries:empty {
      display: none
    }

    .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    .entry span {
      flex: 1;
      word-break: break-all;
      color: var(--text-color-secondary, #aab0ba)
    }

    button.x {
      padding: 0 6px;
      background: transparent;
      color: var(--text-color-tertiary, #8b919c);
      font-size: 14px
    }

    button.x:hover {
      background: transparent;
      color: #f87171
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--text-color-secondary, #aab0ba)
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      flex: none
    }

    .dot.on {
      background: #4ade80
    }

    .dot.off {
      background: #f87171
    }

    #stext {
      flex: 1
    }

    .btns {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      align-items: center
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #3b6ef6;
      color: #fff;
      font-size: 13px;
      cursor: pointer
    }

    button:hover {
      background: #2f5cd8
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--border-color, #3a3f4a);
      color: var(--text-color-secondary, #c6cbd4)
    }

    button.ghost:hover {
      border-color: #4b83f6
    }

    #msg {
      font-size: 12px;
      margin-left: auto
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>AIC 本地设置</h1>
    <div class="sub">本机客户端配置 · 平台不可达时依然可用</div>
    <div class="status"><span class="dot" id="sdot" ref="sdot"></span><span id="stext" ref="stext">检查中…</span></div>
    <label>平台地址 (host)</label>
    <input id="host" ref="host" placeholder="https://ivec.ai">
    <label>凭证 (key)</label>
    <div class="row">
      <input id="key" ref="key" placeholder="host key">
      <button @click="updateKey()" style="white-space:nowrap">更新</button>
    </div>
    <label>工作目录 (work_dir)</label>
    <input id="work_dir" ref="work_dir" placeholder="留空 = 系统临时目录">
    <label>后台超时 (exec_timeout)</label>
    <input id="exec_timeout" ref="exec_timeout" placeholder="留空 = 30m（如 30s / 5m / 1h）">
    <label>默认打开地址 (home_path)</label>
    <input id="home_path" ref="home_path" placeholder="留空 = /（如 /、/a）">
    <div class="auth-title">访问授权</div>
    <div class="auth-hint">deny 恒优先：policy=deny 仅 allow 放行，policy=open 除 deny 全放。保存即生效。</div>
    <div id="auth" ref="auth"></div>
    <div class="btns">
      <button @click="save()">保存</button>
      <button id="btnReconnect" ref="btnReconnect" @click="reconnect()">重连</button>
      <button class="ghost" @click="backToPlatform()">返回平台</button>
      <button class="ghost" ref="btnClose" style="display:none" @click="closePanel()">关闭</button>
      <span id="msg" ref="msg"></span>
    </div>
  </div>
</body>
<script setup>
  // 页面与本地 API 同源（壳页面 /settings 路由）：$mod.$fetch 自动携带 x-aic-code
  setMsg = (text, ok) => {
    $refs.msg.textContent = text;
    if (ok === 'warn') $refs.msg.style.color = '#facc15';
    else $refs.msg.style.color = ok ? '#4ade80' : '#f87171';
  };

  // 网络层失败（本地服务已重启/端口变化）：fetch 抛 TypeError；业务错误走 HTTP JSON
  isNetErr = (e) => e instanceof TypeError || /failed to fetch|networkerror|load failed/i.test((e && e.message) || '');

  // 凭证脏检查基线（get_config 回填值）：与当前输入一致时保存不重绑
  loadedKey = '';

  // 三域授权（fs/net/ssh × policy/deny/allow）：boot 回填 get_config 九键，UI 编辑
  // 内存态，save 全量提交（空数组 = 清空，匹配后端 set_config 整体替换语义）。
  domains = [
    {key: 'fs', name: '文件 (fs)', ph: '路径或 glob，如 /Users/x/proj 或 **/.env'},
    {key: 'net', name: '网络 (net)', ph: 'host:port，如 example.com:443'},
    {key: 'ssh', name: 'SSH (ssh)', ph: 'host[:port]，如 192.168.1.10'},
  ];
  auth = {
    fs: {policy: 'deny', deny: [], allow: []},
    net: {policy: 'open', deny: [], allow: []},
    ssh: {policy: 'deny', deny: [], allow: []},
  };

  renderAuth = () => {
    const root = $refs.auth;
    root.innerHTML = '';
    for (const d of domains) {
      const st = auth[d.key];
      const box = document.createElement('div');
      box.className = 'domain';
      const head = document.createElement('div');
      head.className = 'dhead';
      const name = document.createElement('span');
      name.className = 'dname';
      name.textContent = d.name;
      const sel = document.createElement('select');
      for (const v of ['deny', 'open']) {
        const op = document.createElement('option');
        op.value = v;
        op.textContent = v === 'deny' ? 'deny（仅允许名单放行）' : 'open（除拒绝名单全放）';
        sel.appendChild(op);
      }
      sel.value = st.policy;
      sel.onchange = () => { st.policy = sel.value; };
      head.appendChild(name);
      head.appendChild(sel);
      box.appendChild(head);
      box.appendChild(listEl(d, st, 'deny', '拒绝'));
      box.appendChild(listEl(d, st, 'allow', '允许'));
      root.appendChild(box);
    }
  };

  // 单张名单编辑器：标签 + 条目行（等宽文本 + × 删除）+ 输入行（回车/按钮添加）
  listEl = (d, st, kind, title) => {
    const wrap = document.createElement('div');
    wrap.className = 'alist';
    const lab = document.createElement('label');
    lab.textContent = `${title} (${d.key}_${kind})`;
    wrap.appendChild(lab);
    const ul = document.createElement('div');
    ul.className = 'entries';
    st[kind].forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'entry';
      const t = document.createElement('span');
      t.textContent = item;
      const del = document.createElement('button');
      del.className = 'x';
      del.textContent = '×';
      del.onclick = () => { st[kind].splice(i, 1); renderAuth(); };
      row.appendChild(t);
      row.appendChild(del);
      ul.appendChild(row);
    });
    wrap.appendChild(ul);
    const row = document.createElement('div');
    row.className = 'row';
    const inp = document.createElement('input');
    inp.placeholder = d.ph;
    const add = document.createElement('button');
    add.className = 'ghost';
    add.style.whiteSpace = 'nowrap';
    add.textContent = '添加';
    const doAdd = () => {
      const v = inp.value.trim();
      if (!v || st[kind].includes(v)) return;
      st[kind].push(v);
      renderAuth();
    };
    add.onclick = doAdd;
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
    row.appendChild(inp);
    row.appendChild(add);
    wrap.appendChild(row);
    return wrap;
  };

  refreshStatus = async () => {
    try {
      const s = await $mod.$fetch('/api/get_status');
      if (s.running) {
        $refs.sdot.className = 'dot on';
        $refs.stext.textContent = '已连接 ' + (s.host_id || '') + (s.hostname ? ' @' + s.hostname : '') + (s.version ? ' · ' + s.version : '');
      } else {
        $refs.sdot.className = 'dot off';
        $refs.stext.textContent = '未连接' + (s.host_id ? '（host_id: ' + s.host_id + '）' : '');
      }
    } catch (e) {
      $refs.sdot.className = 'dot off';
      $refs.stext.textContent = '状态获取失败: ' + e.message;
    }
  };

  boot = async () => {
    try {
      const cfg = await $mod.$fetch('/api/get_config');
      $refs.host.value = cfg.host || '';
      $refs.key.value = cfg.key || '';
      loadedKey = cfg.key || '';
      $refs.work_dir.value = cfg.work_dir || '';
      $refs.exec_timeout.value = cfg.exec_timeout || '';
      $refs.home_path.value = cfg.home_path || '/';
      for (const d of domains) {
        auth[d.key].policy = cfg[d.key + '_policy'] || auth[d.key].policy;
        auth[d.key].deny = cfg[d.key + '_deny'] || [];
        auth[d.key].allow = cfg[d.key + '_allow'] || [];
      }
      renderAuth();
    } catch (e) {setMsg('加载失败: ' + e.message, false);}
    refreshStatus();
  };
  boot();

  // 窗口重新获得焦点 → 刷新连接状态（不重拉 get_config，避免覆盖正在编辑的输入框）
  window.addEventListener('focus', () => refreshStatus());

  // 保存：先落盘（set_config）→ 凭证改动过才 bind → 探测跳转。
  // 连接/探测失败都不回滚、不阻断已保存的配置（2026-09-09 修复：原先 bind 在前，
  // 旧凭证连旧地址失败会中断 set_config，导致改地址保存不了）。
  save = async () => {
    const host = $refs.host.value.trim();
    const key = $refs.key.value.trim();
    const work_dir = $refs.work_dir.value.trim();
    const exec_timeout = $refs.exec_timeout.value.trim();
    const home_path = $refs.home_path.value.trim();
    try {
      const body = {host, work_dir, exec_timeout, home_path};
      for (const d of domains) {
        body[d.key + '_policy'] = auth[d.key].policy;
        body[d.key + '_deny'] = auth[d.key].deny;
        body[d.key + '_allow'] = auth[d.key].allow;
      }
      await $mod.$fetch('/api/set_config', {method: 'POST', body});
    } catch (e) {
      setMsg(isNetErr(e) ? '本地服务不可达（可能已重启），请重新打开本地配置页' : '保存失败: ' + e.message, false);
      refreshStatus();
      return;
    }
    if (key && key !== loadedKey) {
      try {
        await $mod.$fetch('/api/bind', {method: 'POST', body: {credential: key}});
        loadedKey = key;
      } catch (e) {
        setMsg('地址已保存；凭证未生效: ' + e.message, 'warn');
        refreshStatus();
        return;
      }
    }
    setMsg('已保存，检测平台…', true);
    await probeAndJump(host, '已保存（平台暂不可达，请检查地址）', true);
    refreshStatus();
  };

  // 归一平台地址（补 scheme + 去尾斜杠）
  normalizeHost = (raw) => {
    let h = (raw || 'https://ivec.ai').trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(h)) h = 'https://' + h;
    return h.replace(/\/+$/, '');
  };

  // 探测 {host}/root.html 可达后跳转平台（Electron：主进程 IPC；浏览器：新标签）。
  // failMsg/warn：不可达提示（保存流程=中性提示，跳转流程=默认红色告警）。
  probeAndJump = async (rawHost, failMsg, warn) => {
    const h = normalizeHost(rawHost);
    let ok = false;
    if (window.aicDesktop && window.aicDesktop.checkPlatform) {
      const r = await window.aicDesktop.checkPlatform(h);
      ok = !!(r && r.ok);
    } else {
      try {
        const r = await $mod.$fetch('/api/check_host', {method: 'POST', body: {host: h}});
        ok = !!(r && r.ok);
      } catch (e) {ok = false;}
    }
    if (ok) {
      const url = h + '/hosts';
      if (window.aicDesktop && window.aicDesktop.openPlatform) {
        window.aicDesktop.openPlatform(url);
      } else {
        window.open(url, '_blank');
      }
      return true;
    }
    setMsg(failMsg || '平台不可达，请检查地址', warn ? 'warn' : false);
    return false;
  };

  updateKey = () => {
    // 跳转 {host}/hosts 绑定（平台设备管理页，桌面经主进程跳转 / 浏览器新标签）
    probeAndJump($refs.host.value.trim());
  };

  reconnect = async () => {
    $refs.btnReconnect.disabled = true;
    try {
      await $mod.$fetch('/api/stop', {method: 'POST', body: {}});
      await $mod.$fetch('/api/start', {method: 'POST', body: {}});
      setMsg('已重连', true);
    } catch (e) {setMsg('重连失败: ' + e.message, false);}
    $refs.btnReconnect.disabled = false;
    refreshStatus();
  };

  backToPlatform = () => {
    // 跳转当前配置的平台地址（主进程跳转 / 浏览器新标签）
    probeAndJump($refs.host.value.trim());
  };

  // 嵌入桌面端 B 区时提供「关闭」（浏览器直开本地页无 aicDesktop.closeSettings，按钮保持隐藏）
  closePanel = () => {
    if (window.aicDesktop && window.aicDesktop.closeSettings) window.aicDesktop.closeSettings();
  };
  if (window.aicDesktop && window.aicDesktop.closeSettings) $refs.btnClose.style.display = '';
</script>

</html>
