<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="AIC Shell Layout" details="Header + outlet for local shell pages">
  <title>AIC</title>
</head>

<style>
  body {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg-color);
  }

  /* ---- header（自定义标题栏：菜单 + 窗口控制） ---- */
  .shell-header {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px 0 16px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-color-secondary);
    user-select: none;
    -webkit-user-select: none;
  }

  /* 拖动区（桌面 frameless）：nav 区可拖，右侧按钮区不可拖 */
  .shell-drag {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }

  .shell-brand {
    display: inline-flex;
    align-items: center;
    height: 100%;
    padding-right: 16px;
    cursor: pointer;
    flex: none;
  }

  .shell-brand .shell-logo {
    height: 26px;
    width: auto;
    display: block;
  }

  .shell-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }

  .shell-nav a {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-color-secondary);
    cursor: pointer;
    transition: color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }

  .shell-nav a:hover {
    color: var(--text-color);
    background: var(--bg-color-tertiary);
  }

  .shell-spacer {
    flex: 1;
  }

  .shell-icon-btn {
    flex: none;
    width: 32px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-color-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: color var(--transition-fast), background var(--transition-fast);
  }

  .shell-icon-btn:hover {
    color: var(--text-color);
    background: var(--bg-color-tertiary);
  }

  .shell-icon-btn.set {
    width: auto;
    padding: 0 12px;
    font-size: 13px;
  }

  /* 窗口控制按钮区（仅 desktop 显示）：不可拖动 */
  .shell-win {
    flex: none;
    display: flex;
    align-items: center;
    gap: 2px;
    padding-left: 8px;
    border-left: 1px solid var(--border-color);
    margin-left: 4px;
  }

  .shell-win .shell-icon-btn {
    width: 36px;
    height: 30px;
  }

  .shell-win .shell-icon-btn.close:hover {
    color: #fff;
    background: #e5484d;
  }

  /* ---- main（路由出口） ---- */
  .shell-main {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
  }
</style>

<body>
  <header class="shell-header">
    <!-- logo → 首页（参考 aic header brand） -->
    <a class="shell-brand" @click="nav('/')" title="首页">
      <img src="/assets/logo.svg" class="shell-logo" alt="ivec.ai">
    </a>
    <div class="shell-drag">
      <nav class="shell-nav">
        <a @click="nav('/a')">Agents</a>
        <a @click="nav('/voices')">Voices</a>
        <a @click="nav('/skills')">Skills</a>
        <a @click="nav('/settings/gateway')">Gateway</a>
      </nav>
    </div>
    <div class="shell-spacer"></div>
    <button class="shell-icon-btn set" @click="$router.push('/settings')">本地设置</button>
    <div v-if="isDesktop" class="shell-win">
      <!-- 桌宠：缩成透明小窗口（/pet 页），出现在鼠标下方 -->
      <button class="shell-icon-btn" @click="pet($event)" title="桌宠">
        <img src="/assets/ai.svg" style="width:16px;height:16px;display:block" alt="pet">
      </button>
      <button class="shell-icon-btn" @click="win('window_minimise')" title="最小化">&#8211;</button>
      <button class="shell-icon-btn" @click="win('window_maximise')" title="最大化/还原">&#9633;</button>
      <button class="shell-icon-btn" @click="win('window_fullscreen')" title="全屏">&#10530;</button>
      <button class="shell-icon-btn close" @click="win('window_close')" title="关闭（隐藏窗口）">&#10005;</button>
    </div>
  </header>
  <vslot class="shell-main">
  </vslot>
</body>

<script setup>
  import dragInit from "/assets/drag.js"

  // desktop 探测 + 平台地址（导航拼接用）
  isDesktop = false
  host = ""
  initShell = async () => {
    try {
      const st = await $mod.$fetch("/api/window_state")
      isDesktop = !!st.desktop
    } catch (e) { /* 非 desktop：隐藏窗口按钮区 */}
    try {
      const cfg = await $mod.$fetch("/api/get_config")
      host = cfg.host || "https://ivec.ai"
    } catch (e) { }
    dragInit(isDesktop)
  }
  initShell()

  // 平台导航：布局发事件，iframe 页（/ 路由）监听后切 src
  nav = (path) => {
    const url = host + path
    // 当前在设置页时先切回 /（iframe 路由），事件随后送达（缓存页不重建）
    if (location.pathname !== "/") {
      $router.push("/")
      setTimeout(() => $mod.$bus.emit("shell-nav", url), 50)
    } else {
      $mod.$bus.emit("shell-nav", url)
    }
  }

  // 窗口控制（desktop；非 desktop 下按钮不显示，调用无副作用）
  // 动作端点为 POST（window_state 为 GET，见 initShell）
  win = (action, body) => {
    $mod.$fetch("/api/" + action, { method: "POST", body: body || {} }).catch(() => { })
  }

  // 桌宠：窗口缩至最小 + 出现在鼠标下方（传鼠标屏幕坐标，Go 侧定位）
  pet = (e) => {
    win("window_pet", { x: e.screenX, y: e.screenY })
    $router.push("/pet")
  }
</script>

</html>
